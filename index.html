<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>汉字 · Карточки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF3E8; --surface:#FFFCF6; --sunk:#F3E7D8; --ink:#2A1B18; --soft:#7C6A62;
    --wine:#8C2230; --deep:#6B1622; --gold:#D4AF37; --goldSoft:#EBD9A5;
    --line:rgba(140,34,48,0.14); --shadow:0 6px 18px rgba(107,22,34,0.06);
    --tone-1:#B07C2A; --tone-2:#6E8A4E; --tone-3:#3F6E8C; --tone-4:#8C3A52; --tone-5:#8A7A72;
    --cream:#FFF7E6;
  }
  :root.dark{
    --bg:#150F0F; --surface:#1E1615; --sunk:#2A1E1D; --ink:#F2E6D5; --soft:#A5928A;
    --wine:#9E2B38; --deep:#5E1420; --gold:#E0BE52; --goldSoft:#8A6F2C;
    --line:rgba(224,190,82,0.16); --shadow:0 8px 22px rgba(0,0,0,0.4);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    font-family:'Noto Sans SC',system-ui,-apple-system,sans-serif;
    transition:background .25s ease, color .25s ease;
  }
  a{color:var(--wine); text-decoration:none;}
  a:hover{color:var(--gold);}
  button,input,textarea{font-family:inherit;}
  input::placeholder,textarea::placeholder{color:#B3A096;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(140,34,48,.22);border-radius:8px;}
  @keyframes zhFade{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
  @keyframes zhBounce{ from{transform:translateY(0);} to{transform:translateY(-9px);} }

  .serif{font-family:'Noto Serif SC',serif;}
  .logo-glyph{font-family:'Ma Shan Zheng',serif;}
  .gold-dash{height:1px; background:repeating-linear-gradient(90deg,var(--gold) 0 3px, transparent 3px 9px); opacity:.22;}
  .orn{position:absolute; inset:0; opacity:.22; pointer-events:none;
    background-image:radial-gradient(circle at 16px 20px, rgba(212,175,55,.55) 0 3px, transparent 4px),
                      radial-gradient(circle at 38px 32px, rgba(212,175,55,.4) 0 5px, transparent 6px);
    background-size:60px 60px;}
  .corner-tr{position:absolute; top:12px; right:12px; width:26px; height:26px; border-top:1px solid rgba(212,175,55,.6); border-right:1px solid rgba(212,175,55,.6); border-radius:0 8px 0 0;}
  .corner-tl{position:absolute; top:14px; left:14px; width:24px; height:24px; border-top:1px solid var(--gold); border-left:1px solid var(--gold); border-radius:8px 0 0 0;}
  .corner-br{position:absolute; bottom:14px; right:14px; width:24px; height:24px; border-bottom:1px solid var(--gold); border-right:1px solid var(--gold); border-radius:0 0 8px 0;}
  .ring{position:absolute; inset:14px; border:1px solid rgba(212,175,55,.55); border-radius:16px; pointer-events:none;}
  .ring-tight{position:absolute; inset:13px; border:1px solid rgba(212,175,55,.5); border-radius:17px; pointer-events:none;}
  .ring-loose{position:absolute; inset:12px; border:1px solid rgba(212,175,55,.45); border-radius:16px; pointer-events:none;}

  .wine-panel{background:linear-gradient(145deg,var(--wine),var(--deep)); color:var(--cream); position:relative;}
  .wine-panel-steep{background:linear-gradient(155deg,var(--wine),var(--deep)); color:var(--cream); position:relative;}

  .icon{display:block;}
  .icon svg{display:block;}

  /* ---------- shell / layout ---------- */
  #app{min-height:100vh;}
  .shell{min-height:100vh; display:flex; background:var(--bg); color:var(--ink);}

  .sidebar{width:252px; flex:0 0 252px; padding:30px 20px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:30px; position:sticky; top:0; height:100vh;}
  .sidebar-brand{display:flex; align-items:center; gap:12px; padding:0 8px;}
  .sidebar-mark{width:44px; height:44px; border-radius:12px; background:linear-gradient(150deg,var(--wine),var(--deep)); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(107,22,34,.28); flex:0 0 44px;}
  .sidebar-mark span{font-family:'Ma Shan Zheng',serif; font-size:26px; color:var(--gold); line-height:1; padding-bottom:3px;}
  .sidebar-title{font-family:'Noto Serif SC',serif; font-weight:600; font-size:17px;}
  .sidebar-sub{font-size:11px; color:var(--soft); letter-spacing:.13em; text-transform:uppercase;}
  .nav-list{display:flex; flex-direction:column; gap:4px;}
  .nav-btn{display:flex; align-items:center; gap:13px; padding:12px 14px; border:none; border-radius:12px; font-size:14.5px; font-weight:500; cursor:pointer; text-align:left; transition:background .18s ease; background:transparent; color:var(--soft); width:100%;}
  .nav-btn:hover{background:var(--sunk);}
  .nav-btn.active{background:rgba(140,34,48,0.08); color:var(--wine);}
  :root.dark .nav-btn.active{background:rgba(224,190,82,0.12);}
  .nav-btn .icon{width:20px; height:20px; flex:0 0 20px;}
  .dash-btn{padding:14px; border:1px dashed var(--gold); border-radius:14px; background:transparent; color:var(--wine); font-size:14.5px; font-weight:500; cursor:pointer;}
  .dash-btn:hover{background:var(--sunk);}
  .streak-card{margin-top:auto; padding:16px; border:1px solid var(--line); border-radius:16px; background:var(--surface);}
  .streak-card .lbl{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--soft);}
  .streak-card .val-row{display:flex; align-items:baseline; gap:8px; margin-top:6px;}
  .streak-card .val{font-family:'Noto Serif SC',serif; font-size:32px; font-weight:600; color:var(--wine);}
  .streak-card .unit{font-size:13px; color:var(--soft);}
  .streak-card .note{margin-top:8px; font-size:12.5px; color:var(--soft); line-height:1.5;}

  .main{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:14px;}
  .main.wide{padding:32px 40px;}
  .main.narrow{padding:18px 16px 0;}
  .main.narrow .content-col{padding-bottom:88px;}
  .content-col{width:100%; max-width:780px; display:flex; flex-direction:column;}

  .screen-header{display:flex; align-items:center; gap:12px;}
  .round-btn{width:42px; height:42px; flex:0 0 42px; border:1px solid var(--line); border-radius:50%; background:var(--surface); color:var(--wine); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
  .round-btn:hover{border-color:var(--gold);}
  .round-btn .icon{width:20px; height:20px;}

  h1.page-title{font-family:'Noto Serif SC',serif; font-weight:600; margin:0; font-size:clamp(22px,4vw,28px);}

  /* ---------- onboarding ---------- */
  .onboarding{flex:1; display:flex; flex-direction:column; justify-content:center; gap:32px; animation:zhFade .4s ease; padding:24px 0 8px;}
  .onboarding-tile{position:relative; align-self:center; width:min(290px,78%); aspect-ratio:1/1.18; border-radius:26px; box-shadow:0 26px 60px -18px rgba(107,22,34,.55); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .onboarding-tile span{position:relative; font-family:'Noto Serif SC',serif; font-size:clamp(88px,19vw,126px); font-weight:500; color:var(--gold); line-height:1;}
  .onboarding-copy{text-align:center; display:flex; flex-direction:column; gap:14px; align-items:center;}
  .onboarding-copy .rule{height:1px; width:64px; background:var(--gold); opacity:.7;}
  .onboarding-copy h1{font-family:'Noto Serif SC',serif; font-size:clamp(26px,5vw,36px); font-weight:600; margin:0; line-height:1.25;}
  .onboarding-copy p{margin:0; max-width:440px; font-size:15.5px; line-height:1.65; color:var(--soft);}
  .onboarding-actions{display:flex; flex-direction:column; gap:12px; align-self:center; width:min(360px,100%);}
  .btn-primary{padding:17px 22px; border:none; border-radius:16px; background:linear-gradient(140deg,var(--wine),var(--deep)); color:var(--cream); font-size:16px; font-weight:500; cursor:pointer; box-shadow:0 12px 26px -8px rgba(107,22,34,.6); transition:color .18s ease, box-shadow .2s ease;}
  .btn-primary:hover{box-shadow:0 0 0 1.5px var(--gold), 0 14px 30px -8px rgba(107,22,34,.6); color:var(--gold);}
  .btn-ghost{padding:14px 22px; border:none; border-radius:14px; background:transparent; color:var(--soft); font-size:14px; cursor:pointer;}
  .btn-ghost:hover{color:var(--wine);}

  /* ---------- home ---------- */
  .home-screen{animation:zhFade .3s ease; display:flex; flex-direction:column; gap:20px;}
  .home-header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding-top:4px;}
  .eyebrow{font-size:12px; letter-spacing:.15em; text-transform:uppercase; color:var(--soft);}
  .home-header h1{font-family:'Noto Serif SC',serif; font-size:clamp(23px,4.4vw,30px); font-weight:600; margin:6px 0 0;}

  .hero{position:relative; overflow:hidden; border-radius:22px; padding:24px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; box-shadow:0 20px 44px -20px rgba(107,22,34,.6);}
  .hero .body{position:relative; flex:1 1 220px; min-width:0;}
  .hero .eyebrow{color:var(--gold);}
  .hero .big-num{display:flex; align-items:baseline; gap:10px; margin-top:8px;}
  .hero .big-num span:first-child{font-family:'Noto Serif SC',serif; font-size:42px; font-weight:600; line-height:1;}
  .hero .big-num span:last-child{font-size:14px; opacity:.85;}
  .hero .goal-row{margin-top:14px; display:flex; align-items:center; gap:9px;}
  .hero .dot{width:7px; height:7px; border-radius:50%; flex:0 0 7px;}
  .hero .track{flex:1; height:8px; border-radius:99px; background:rgba(255,247,230,.18); overflow:hidden;}
  .hero .fill{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--gold),#F0DDA4); transition:width .5s ease;}
  .hero .goal-note{margin-top:8px; font-size:12.5px; opacity:.8;}
  .hero-btn{position:relative; padding:15px 26px; border:1px solid var(--gold); border-radius:14px; background:rgba(255,247,230,.06); color:var(--gold); font-size:15px; font-weight:500; cursor:pointer; min-height:50px; transition:background .18s ease, color .18s ease;}
  .hero-btn:hover{background:var(--gold); color:var(--deep);}
  .hero-btn:disabled{opacity:.5; cursor:default;}

  .section-row{display:flex; align-items:center; gap:14px; margin-top:2px;}
  .section-row h2{font-family:'Noto Serif SC',serif; font-size:18px; font-weight:600; margin:0;}
  .section-row .rule{flex:1;}
  .section-row .count{font-size:13px; color:var(--soft);}

  .lesson-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  .lesson-card{position:relative; padding:18px; border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px; transition:transform .16s ease, border-color .2s ease;}
  .lesson-card:hover{transform:translateY(-2px); border-color:var(--gold);}
  .lesson-card .top{display:flex; align-items:flex-start; gap:12px;}
  .lesson-card .clickable{flex:1; min-width:0; cursor:pointer;}
  .lesson-card .title{font-family:'Noto Serif SC',serif; font-size:16.5px; font-weight:600; line-height:1.3;}
  .lesson-card .meta{margin-top:5px; font-size:12.5px; color:var(--soft);}
  .lesson-card .actions{display:flex; gap:6px; flex:0 0 auto;}
  .icon-btn-sq{width:36px; height:36px; border:1px solid var(--line); border-radius:10px; background:transparent; cursor:pointer; color:var(--soft); display:flex; align-items:center; justify-content:center; padding:0;}
  .icon-btn-sq .icon{width:16px; height:16px;}
  .icon-btn-sq:hover{color:var(--wine); border-color:var(--gold);}
  .icon-btn-sq.danger:hover{border-color:var(--wine);}
  .lesson-card .prog-row{display:flex; align-items:center; gap:10px;}
  .lesson-card .prog-track{flex:1; height:7px; border-radius:99px; background:var(--sunk); overflow:hidden;}
  .lesson-card .prog-fill{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--goldSoft),var(--gold));}
  .lesson-card .prog-pct{font-size:12px; color:var(--soft);}
  .lesson-card .preview{display:flex; gap:6px; flex-wrap:wrap; font-family:'Noto Serif SC',serif; font-size:19px; color:var(--wine);}
  .new-lesson-tile{min-height:150px; border:1px dashed var(--gold); border-radius:20px; background:transparent; color:var(--wine); font-size:15px; font-weight:500; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;}
  .new-lesson-tile:hover{background:var(--sunk);}
  .new-lesson-tile .plus{font-size:24px; line-height:1;}

  /* ---------- editor ---------- */
  .editor-screen{animation:zhFade .3s ease; display:flex; flex-direction:column; gap:18px; padding-top:4px;}
  .field-label{display:block; font-size:11.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--soft); margin-bottom:8px;}
  .text-input{width:100%; min-height:52px; padding:14px 16px; border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); font-size:16px; outline:none;}
  .text-input:focus{border-color:var(--gold);}
  .draft-header{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .draft-header h2{font-family:'Noto Serif SC',serif; font-size:16px; font-weight:600; margin:0;}
  .draft-header .rule{flex:1; min-width:24px;}
  .fill-pinyin-btn{padding:9px 14px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--wine); font-size:13px; cursor:pointer;}
  .fill-pinyin-btn:hover{border-color:var(--gold);}
  .empty-hint{padding:22px; border-radius:16px; background:var(--sunk); color:var(--soft); font-size:14px; text-align:center;}
  .word-row{display:flex; gap:10px; align-items:center; padding:12px; border:1px solid var(--line); border-radius:16px; background:var(--surface); flex-wrap:wrap;}
  .word-row input.hanzi{flex:1 1 110px; min-width:96px; min-height:46px; padding:10px 14px; border:1px solid var(--line); border-radius:11px; background:transparent; color:var(--wine); font-family:'Noto Serif SC',serif; font-size:20px; outline:none;}
  .word-row input.pinyin{flex:1 1 130px; min-width:110px; min-height:46px; padding:10px 14px; border:1px solid var(--line); border-radius:11px; background:transparent; color:var(--ink); font-family:'Noto Serif SC',serif; font-size:15.5px; outline:none;}
  .word-row input.translation{flex:2 1 150px; min-width:120px; min-height:46px; padding:10px 14px; border:1px solid var(--line); border-radius:11px; background:transparent; color:var(--ink); font-size:15px; outline:none;}
  .word-row input:focus{border-color:var(--gold);}
  .word-row .rm{width:44px; height:44px; flex:0 0 44px; border:none; border-radius:50%; background:var(--sunk); color:var(--soft); font-size:16px; cursor:pointer;}
  .word-row .rm:hover{color:var(--wine);}
  .add-row-btn{width:100%; min-height:52px; padding:15px; border:1px dashed var(--gold); border-radius:15px; background:transparent; color:var(--wine); font-size:15px; font-weight:500; cursor:pointer;}
  .add-row-btn:hover{background:var(--sunk);}
  .bulk-box{border:1px solid var(--line); border-radius:18px; background:var(--surface); overflow:hidden;}
  .bulk-toggle{width:100%; min-height:52px; padding:16px 18px; border:none; background:transparent; color:var(--ink); font-size:15px; text-align:left; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .bulk-toggle .chevron{color:var(--soft); font-size:13px;}
  .bulk-body{padding:0 18px 18px; display:flex; flex-direction:column; gap:12px;}
  .bulk-body .hint{font-size:12.5px; color:var(--soft); line-height:1.5;}
  .bulk-body textarea{width:100%; min-height:130px; padding:14px 16px; border:1px solid var(--line); border-radius:14px; background:transparent; color:var(--ink); font-size:15px; line-height:1.6; resize:vertical; outline:none;}
  .bulk-body textarea:focus{border-color:var(--gold);}
  .bulk-apply{align-self:flex-start; padding:13px 20px; border:1px solid var(--gold); border-radius:12px; background:transparent; color:var(--wine); font-size:14.5px; cursor:pointer; min-height:46px;}
  .bulk-apply:hover{background:var(--sunk);}
  .editor-footer{display:flex; gap:12px; position:sticky; bottom:12px; padding-top:6px;}
  .btn-outline{flex:1; min-height:54px; padding:16px; border:1px solid var(--line); border-radius:15px; background:var(--surface); color:var(--ink); font-size:15px; cursor:pointer;}
  .btn-outline:hover{border-color:var(--wine);}
  .btn-save{flex:2; min-height:54px; padding:16px; border:none; border-radius:15px; background:linear-gradient(140deg,var(--wine),var(--deep)); color:var(--cream); font-size:15px; font-weight:500; cursor:pointer; box-shadow:0 12px 26px -12px rgba(107,22,34,.6); transition:color .18s ease;}
  .btn-save:hover{color:var(--gold);}

  /* ---------- study ---------- */
  .study-screen{animation:zhFade .3s ease; flex:1; display:flex; flex-direction:column; gap:16px;}
  .study-title{font-family:'Noto Serif SC',serif; font-size:16.5px; font-weight:600;}
  .study-sub{font-size:12px; color:var(--soft);}
  .mode-tabs{display:flex; padding:4px; gap:4px; border:1px solid var(--line); border-radius:14px; background:var(--surface);}
  .mode-tabs button{flex:1; min-height:46px; padding:12px; border:none; border-radius:11px; font-size:14.5px; font-weight:500; cursor:pointer; background:transparent; color:var(--soft); transition:background .18s ease, color .18s ease;}
  .mode-tabs button.active{background:var(--wine); color:var(--cream);}
  .mode-tabs button:disabled{opacity:.4; cursor:default;}

  .progress-row{display:flex; align-items:center; gap:10px;}
  .progress-cap{width:10px; height:14px; border-radius:3px; background:linear-gradient(180deg,var(--wine),var(--deep)); flex:0 0 10px;}
  .progress-track{flex:1; height:10px; border-radius:99px; background:var(--sunk); overflow:hidden; box-shadow:inset 0 1px 2px rgba(107,22,34,.12);}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--goldSoft),var(--gold)); border-radius:99px; transition:width .35s ease;}
  .progress-pct{font-size:12.5px; color:var(--soft); min-width:38px; text-align:right;}

  .flip-stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:6px 0; perspective:1600px;}
  .flashcard{position:relative; width:min(360px,88%); aspect-ratio:1/1.2; max-height:54vh; cursor:pointer; transform-style:preserve-3d; transition:transform .62s cubic-bezier(.32,.72,.2,1);}
  .flashcard.flipped{transform:rotateY(180deg);}
  .fc-face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:26px; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px; text-align:center; transition:box-shadow .5s ease;}
  .fc-front{box-shadow:0 18px 40px -18px rgba(107,22,34,.45);}
  .flashcard.flipped .fc-front{box-shadow:0 34px 64px -20px rgba(107,22,34,.6);}
  .fc-front .hanzi-big{position:relative; font-family:'Noto Serif SC',serif; font-size:clamp(66px,17vw,104px); font-weight:500; color:var(--gold); line-height:1.06;}
  .fc-front .tap-hint{position:relative; margin-top:20px; font-size:12px; letter-spacing:.13em; text-transform:uppercase; color:rgba(253,244,227,.62);}
  .fc-back{transform:rotateY(180deg); background:var(--surface); border:1px solid var(--line); box-shadow:0 18px 40px -18px rgba(107,22,34,.45); gap:14px;}
  .flashcard.flipped .fc-back{box-shadow:0 34px 64px -20px rgba(107,22,34,.6);}
  .fc-back .hanzi-ghost{font-family:'Noto Serif SC',serif; font-size:32px; font-weight:500; color:var(--ink); opacity:.3;}
  .fc-back .syllables{display:flex; gap:7px; flex-wrap:wrap; justify-content:center; font-family:'Noto Serif SC',serif; font-size:clamp(23px,6vw,29px); font-weight:500;}
  .fc-back .translation{font-size:17px; line-height:1.5;}
  .fc-back .tone-hint{font-size:12px; color:var(--soft);}

  .srs-row{display:flex; gap:12px; width:min(400px,92%);}
  .srs-btn{flex:1; min-height:56px; padding:16px; border-radius:15px; font-size:15px; font-weight:500; cursor:pointer;}
  .srs-btn.repeat{border:1px solid var(--line); background:var(--surface); color:var(--wine);}
  .srs-btn.repeat:hover{border-color:var(--wine); background:var(--sunk);}
  .srs-btn.know{border:none; background:linear-gradient(140deg,var(--wine),var(--deep)); color:var(--cream); box-shadow:0 10px 22px -10px rgba(107,22,34,.6); transition:color .18s ease;}
  .srs-btn.know:hover{color:var(--gold);}

  .nav-row{display:flex; align-items:center; gap:10px; width:min(400px,92%); justify-content:center;}
  .nav-row button{flex:1; min-height:48px; padding:13px; border:none; border-radius:13px; background:var(--sunk); color:var(--soft); font-size:14px; cursor:pointer;}
  .nav-row button:last-child{color:var(--ink);}
  .nav-row button:hover{color:var(--wine);}
  .restart-link{border:none; background:transparent; color:var(--soft); font-size:13px; cursor:pointer; text-decoration:underline; padding:6px 10px;}
  .restart-link:hover{color:var(--wine);}
  .srs-hint{font-size:12.5px; color:var(--soft); text-align:center;}

  .guess-stage{flex:1; display:flex; flex-direction:column; align-items:center; gap:20px; padding-top:8px;}
  .guess-prompt{position:relative; width:min(360px,90%); padding:34px 24px; border-radius:24px; text-align:center; box-shadow:0 22px 44px -22px rgba(107,22,34,.6); overflow:hidden;}
  .guess-prompt .hanzi{position:relative; font-family:'Noto Serif SC',serif; font-size:clamp(54px,13vw,80px); font-weight:500; color:var(--gold); line-height:1.1;}
  .guess-prompt .hint{position:relative; margin-top:10px; font-size:12.5px; letter-spacing:.13em; text-transform:uppercase; color:rgba(253,244,227,.62);}
  .guess-options{width:min(440px,100%); display:flex; flex-direction:column; gap:11px;}

  .guess-option:hover{border-color:var(--gold);}
  .guess-next{width:min(440px,100%); min-height:54px; padding:16px; border:none; border-radius:15px; background:linear-gradient(140deg,var(--wine),var(--deep)); color:var(--cream); font-size:15px; font-weight:500; cursor:pointer;}
  .guess-next:hover{color:var(--gold);}

  /* ---------- done screen ---------- */
  .done-screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; padding:20px; animation:zhFade .35s ease;}
  .done-emoji{width:min(220px,64%); aspect-ratio:1/1; border-radius:26px; display:flex; align-items:center; justify-content:center; box-shadow:0 26px 60px -18px rgba(107,22,34,.55); margin-bottom:8px; animation:zhBounce .9s ease infinite alternate; position:relative; overflow:hidden;}
  .done-emoji span{position:relative; font-family:'Noto Serif SC',serif; font-size:76px; color:var(--gold);}
  .done-screen h2{font-family:'Noto Serif SC',serif; margin:4px 0 4px; font-size:26px;}
  .done-screen p{color:var(--soft); margin:0 0 6px; font-size:14.5px; max-width:440px;}
  .done-actions{display:flex; gap:12px; width:100%; max-width:340px; margin-top:18px;}
  .done-actions > *{flex:1;}

  /* ---------- stats ---------- */
  .stats-screen{animation:zhFade .3s ease; display:flex; flex-direction:column; gap:18px; padding-top:4px;}
  .stats-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px;}
  .streak-tile{grid-column:span 2; position:relative; overflow:hidden; padding:20px; border-radius:20px; box-shadow:0 18px 36px -20px rgba(107,22,34,.6);}
  .streak-tile .lbl{position:relative; font-size:11.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--gold);}
  .streak-tile .row{position:relative; display:flex; align-items:baseline; gap:8px; margin-top:8px;}
  .streak-tile .row span:first-child{font-family:'Noto Serif SC',serif; font-size:40px; font-weight:600; line-height:1;}
  .streak-tile .row span:last-child{font-size:13px; opacity:.85;}
  .streak-tile .note{position:relative; margin-top:12px; font-size:12.5px; opacity:.8;}
  .stat-tile{padding:20px; border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:var(--shadow); display:flex; flex-direction:column;}
  .stat-tile .lbl{font-size:11.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--soft);}
  .stat-tile .row{display:flex; align-items:baseline; gap:6px; margin-top:8px;}
  .stat-tile .row span:first-child{font-family:'Noto Serif SC',serif; font-size:32px; font-weight:600;}
  .stat-tile .row span:last-child{font-size:12.5px; color:var(--soft);}
  .stat-tile .note{margin-top:auto; padding-top:16px; font-size:12.5px; color:var(--soft);}

  .panel{padding:22px; border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:var(--shadow);}
  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .panel-head h2{font-family:'Noto Serif SC',serif; font-size:16.5px; font-weight:600; margin:0;}
  .panel-head .note{font-size:12.5px; color:var(--soft);}
  .chart{margin-top:20px; display:flex; align-items:flex-end; gap:6px; height:170px; overflow-x:auto;}
  .chart-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end; min-width:16px;}
  .chart-bar{width:100%; max-width:26px; min-height:4px; border-radius:6px 6px 3px 3px;}
  .chart-col .lbl{font-size:10.5px; color:var(--soft); white-space:nowrap;}

  .bucket-row{display:flex; align-items:center; gap:14px;}
  .bucket-row .lbl{font-size:13.5px; color:var(--soft); width:110px; flex:0 0 110px;}
  .bucket-track{flex:1; height:9px; border-radius:99px; background:var(--sunk); overflow:hidden;}
  .bucket-fill{height:100%; border-radius:99px;}
  .bucket-count{font-size:13px; width:38px; text-align:right;}

  /* ---------- settings ---------- */
  .settings-screen{animation:zhFade .3s ease; display:flex; flex-direction:column; gap:18px; padding-top:4px;}
  .toggle-list{border:1px solid var(--line); border-radius:20px; background:var(--surface); overflow:hidden;}
  .toggle-row{display:flex; align-items:center; gap:16px; padding:17px 20px; border-bottom:1px solid var(--line);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .info{flex:1; min-width:0;}
  .toggle-row .label{font-size:15px; font-weight:500;}
  .toggle-row .note{font-size:12.5px; color:var(--soft); margin-top:3px; line-height:1.45;}
  .switch{width:52px; height:30px; flex:0 0 52px; border:none; border-radius:99px; cursor:pointer; padding:3px; transition:background .22s ease;}
  .switch .knob{width:24px; height:24px; border-radius:50%; background:#FFF8EA; box-shadow:0 2px 5px rgba(0,0,0,.22); transition:transform .22s cubic-bezier(.3,.7,.2,1);}
  .goal-stepper{display:flex; gap:8px;}
  .step-btn{width:44px; height:44px; border:1px solid var(--line); border-radius:12px; background:transparent; color:var(--wine); font-size:18px; cursor:pointer;}
  .step-btn:hover{border-color:var(--gold);}
  .tone-legend{padding:20px; border-radius:20px; border:1px solid var(--line); background:var(--surface);}
  .tone-legend .lbl{font-size:11.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--soft);}
  .tone-legend .chips{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .tone-chip{display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:99px; background:var(--sunk);}
  .tone-chip .dot{width:9px; height:9px; border-radius:50%; flex:0 0 9px;}
  .tone-chip .sample{font-family:'Noto Serif SC',serif; font-size:14px;}
  .tone-chip .label{font-size:12px; color:var(--soft);}

  /* ---------- bottom nav (mobile) ---------- */
  .bottom-nav{position:sticky; bottom:0; width:100%; max-width:780px; margin-top:auto; padding:8px; border-radius:20px 20px 0 0; border-top:1px solid var(--line); background:var(--surface); box-shadow:0 -10px 30px -18px rgba(107,22,34,.35); display:flex; gap:4px;}
  .bnav-btn{flex:1 1 0; min-width:0; min-height:58px; border:none; border-radius:14px; background:transparent; color:var(--soft); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; font-size:10.5px; white-space:nowrap; cursor:pointer;}
  .bnav-btn.active{background:rgba(140,34,48,0.08); color:var(--wine);}
  :root.dark .bnav-btn.active{background:rgba(224,190,82,0.12);}
  .bnav-btn .icon{width:21px; height:21px;}
  .bnav-fab{flex:0 0 62px; min-height:58px; margin:-16px 4px 0; border:none; border-radius:18px; background:linear-gradient(140deg,var(--wine),var(--deep)); color:var(--gold); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 12px 24px -10px rgba(107,22,34,.65), 0 0 0 1px rgba(212,175,55,.45) inset; font-size:26px; line-height:1; padding-bottom:3px;}

  /* ---------- toast / modal (kept from base app) ---------- */
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:12px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:100; box-shadow:0 8px 20px rgba(0,0,0,0.25);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .modal-backdrop{position:fixed; inset:0; background:rgba(20,12,10,.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; animation:zhFade .2s ease;}
  .modal{background:var(--surface); border-radius:20px; padding:22px; max-width:340px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,.3); text-align:center;}
  .modal h3{font-family:'Noto Serif SC',serif; margin:0 0 8px; font-size:17px;}
  .modal p{margin:0 0 18px; color:var(--soft); font-size:14px;}
  .modal-row{display:flex; gap:10px;}
  .modal-row > *{flex:1;}
  .btn-danger{background:linear-gradient(135deg,var(--wine),var(--deep)); color:var(--cream); border:none; border-radius:14px; padding:14px 18px; font-size:15px; font-weight:600; cursor:pointer;}

  @media (max-width:640px){
    .hero{padding:20px;}
    .lesson-grid{grid-template-columns:1fr;}
  }
</style>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<!-- Библиотека транслитерации иероглифов в пиньинь -->
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro/dist/index.js"></script>

<script>
(function(){
  "use strict";

  /* ===================== DATA LAYER ===================== */
  var STORAGE_KEY = "hanzi_flashcards_lessons_v1";
  var STATS_KEY = "hanzi_flashcards_stats_v1";
  var SETTINGS_KEY = "hanzi_flashcards_settings_v1";
  var QUIZ_KEY = "hanzi_flashcards_quiz_v1";
  var BEST_STREAK_KEY = "hanzi_flashcards_best_streak_v1";
  var LEARNED_INTERVAL_THRESHOLD = 21; // дней — считаем слово "выученным"
  var CHART_DAYS = 14;

  function loadJSON(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      if(raw == null) return fallback;
      var parsed = JSON.parse(raw);
      return parsed == null ? fallback : parsed;
    }catch(e){ return fallback; }
  }
  function saveJSON(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  }

  function loadLessons(){
    var l = loadJSON(STORAGE_KEY, []);
    return Array.isArray(l) ? l : [];
  }
  function saveLessons(lessons){ saveJSON(STORAGE_KEY, lessons); }

  function uid(){
    return Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,9);
  }

  /* ---------- дата и время ---------- */
  function formatDate(d){
    var y = d.getFullYear(), m = ("0"+(d.getMonth()+1)).slice(-2), day = ("0"+d.getDate()).slice(-2);
    return y + "-" + m + "-" + day;
  }
  function todayStr(){ return formatDate(new Date()); }
  function addDays(date, days){
    var d = new Date(date.getTime());
    d.setDate(d.getDate() + days);
    return d;
  }
  function daysBetween(fromStr, toStr){
    var a = new Date(fromStr+"T00:00:00"), b = new Date(toStr+"T00:00:00");
    return Math.round((b - a) / 86400000);
  }

  /* ---------- пиньинь автогенерация (pinyin-pro, CDN) ---------- */
  function autoPinyin(hanzi){
    try{
      if(window.pinyinPro && typeof window.pinyinPro.pinyin === "function"){
        var result = window.pinyinPro.pinyin(hanzi, { toneType: "symbol" });
        return (result || "").trim();
      }
    }catch(e){ console.warn("Pinyin generation failed", e); }
    return "";
  }

  /* ---------- тона пиньиня (для цветовой раскраски слогов) ---------- */
  var TONE = { 1:"var(--tone-1)", 2:"var(--tone-2)", 3:"var(--tone-3)", 4:"var(--tone-4)", 5:"var(--tone-5)" };
  var TONE_MAP = { "ā":1,"ē":1,"ī":1,"ō":1,"ū":1,"ǖ":1, "á":2,"é":2,"í":2,"ó":2,"ú":2,"ǘ":2, "ǎ":3,"ě":3,"ǐ":3,"ǒ":3,"ǔ":3,"ǚ":3, "à":4,"è":4,"ì":4,"ò":4,"ù":4,"ǜ":4 };
  function syllables(pinyin, colored){
    return String(pinyin || "—").split(/\s+/).filter(Boolean).map(function(text){
      var tone = 5;
      for(var i=0;i<text.length;i++){ if(TONE_MAP[text[i]]){ tone = TONE_MAP[text[i]]; break; } }
      return { text: text, color: colored ? TONE[tone] : "var(--ink)" };
    });
  }

  /* ---------- SRS (упрощённый SM-2) ---------- */
  function ensureSrs(word){
    if(!word.srs){
      word.srs = { interval: 0, easeFactor: 2.5, repetitions: 0, nextReviewDate: null };
    }
    return word.srs;
  }
  function isDue(word){
    var s = ensureSrs(word);
    if(!s.nextReviewDate) return true;
    return s.nextReviewDate <= todayStr();
  }
  function daysUntilDue(word){
    var s = ensureSrs(word);
    if(!s.nextReviewDate) return 0;
    var d = daysBetween(todayStr(), s.nextReviewDate);
    return Math.max(0, d);
  }
  function updateEaseFactor(ef, q){
    var next = ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
    return Math.max(1.3, next);
  }
  function srsAnswer(word, correct){
    var s = ensureSrs(word);
    var q = correct ? 5 : 2;
    s.easeFactor = updateEaseFactor(s.easeFactor, q);
    if(correct){
      s.repetitions = (s.repetitions || 0) + 1;
      if(s.repetitions === 1) s.interval = 1;
      else if(s.repetitions === 2) s.interval = 6;
      else s.interval = Math.round(s.interval * s.easeFactor);
    } else {
      s.repetitions = 0;
      s.interval = 1;
    }
    s.nextReviewDate = formatDate(addDays(new Date(), s.interval));
    s.lastReviewDate = todayStr();
  }
  function getDueWords(){
    var due = [];
    state.lessons.forEach(function(lesson){
      lesson.words.forEach(function(w){ if(isDue(w)) due.push(w); });
    });
    persist();
    return due;
  }
  function countLearnedWords(){
    var count = 0;
    state.lessons.forEach(function(lesson){
      lesson.words.forEach(function(w){
        if(w.srs && w.srs.interval >= LEARNED_INTERVAL_THRESHOLD) count++;
      });
    });
    return count;
  }

  /* ---------- статистика по дням ---------- */
  function loadStats(){
    var s = loadJSON(STATS_KEY, []);
    return Array.isArray(s) ? s : [];
  }
  function saveStats(stats){ saveJSON(STATS_KEY, stats); }
  function logCardReviewed(){
    var stats = loadStats();
    var today = todayStr();
    var entry = null;
    for(var i=0;i<stats.length;i++){ if(stats[i].date === today){ entry = stats[i]; break; } }
    if(entry){ entry.count += 1; } else { stats.push({ date: today, count: 1 }); }
    saveStats(stats);
  }
  function todayCount(){
    var stats = loadStats();
    var today = todayStr();
    for(var i=0;i<stats.length;i++){ if(stats[i].date === today) return stats[i].count; }
    return 0;
  }
  function computeStreak(){
    var stats = loadStats();
    var map = {};
    stats.forEach(function(s){ map[s.date] = s.count; });
    var d = new Date();
    if(!(map[formatDate(d)] > 0)) d = addDays(d, -1);
    var streak = 0;
    while(map[formatDate(d)] > 0){ streak++; d = addDays(d, -1); }
    return streak;
  }
  function updateBestStreak(current){
    var best = loadJSON(BEST_STREAK_KEY, 0);
    if(current > best){ best = current; saveJSON(BEST_STREAK_KEY, best); }
    return best;
  }
  function lastNDays(n){
    var arr = [];
    for(var i=n-1;i>=0;i--) arr.push(formatDate(addDays(new Date(), -i)));
    return arr;
  }
  function dayLabel(dateStr){
    var d = new Date(dateStr + "T00:00:00");
    return String(d.getDate());
  }

  /* ---------- точность в режиме "Угадай перевод" ---------- */
  function loadQuizStats(){ return loadJSON(QUIZ_KEY, { correct:0, total:0 }); }
  function logQuizAnswer(correct){
    var q = loadQuizStats();
    q.total += 1;
    if(correct) q.correct += 1;
    saveJSON(QUIZ_KEY, q);
  }

  /* ---------- настройки ---------- */
  function loadSettings(){
    return Object.assign({ dark:false, pinyinAuto:true, srsEnabled:true, toneColors:true, sound:false, goal:20 }, loadJSON(SETTINGS_KEY, {}));
  }
  function saveSettings(s){ saveJSON(SETTINGS_KEY, s); }

  /* ---------- озвучка ---------- */
  function speak(text){
    try{
      if(!state.settings.sound) return;
      if(!("speechSynthesis" in window) || !text) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ---------- иконки (line-art SVG, как в дизайне) ---------- */
  var ICON_PATHS = {
    home: '<path d="M3 9l7.5-6L18 9v8.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>',
    study: '<rect x="2.5" y="4" width="16" height="13" rx="3"/><path d="M7 8.5h7M7 12h4.5"/>',
    stats: '<path d="M4 16V9M10.5 16V4M17 16v-5"/>',
    settings: '<path d="M3 6.5h14M3 13.5h14"/><circle cx="8" cy="6.5" r="2.4"/><circle cx="13.5" cy="13.5" r="2.4"/>',
    sun: '<circle cx="10" cy="10" r="4"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6L16 16M16 4l-1.4 1.4M5.4 14.6L4 16"/>',
    moon: '<path d="M15.5 12.6A6.5 6.5 0 0 1 7.4 4.5a6.6 6.6 0 1 0 8.1 8.1z"/>',
    pencil: '<path d="M13.4 3.6l3 3L7.5 15.5l-3.9.9.9-3.9z"/>',
    trash: '<path d="M3.5 5.5h13M8 5.5V3.8h4v1.7M5.5 5.5l.8 11.2h7.4l.8-11.2M8.4 8.7v5M11.6 8.7v5"/>',
    shuffle: '<path d="M3 5.5h3.2l7.6 9h3.2M3 14.5h3.2l3-3.6M11.4 6.9l2.4-1.4h3.2"/><path d="M15.2 3.2L17.8 5.5l-2.6 2.3M15.2 12.2l2.6 2.3-2.6 2.3"/>'
  };
  function iconSvg(name){
    return '<svg viewBox="0 0 20 20" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICON_PATHS[name] || "") + '</svg>';
  }

  var SEED = [
    { id:"l1", title:"Урок 1 · Приветствия", words:[
      { id: uid(), hanzi:"你好", pinyin:"nǐ hǎo", translation:"привет" },
      { id: uid(), hanzi:"谢谢", pinyin:"xièxie", translation:"спасибо" },
      { id: uid(), hanzi:"再见", pinyin:"zàijiàn", translation:"до свидания" },
      { id: uid(), hanzi:"对不起", pinyin:"duìbùqǐ", translation:"извините" },
      { id: uid(), hanzi:"没关系", pinyin:"méi guānxi", translation:"ничего страшного" }
    ]},
    { id:"l2", title:"Урок 2 · В классе", words:[
      { id: uid(), hanzi:"老师", pinyin:"lǎoshī", translation:"учитель" },
      { id: uid(), hanzi:"同学", pinyin:"tóngxué", translation:"одноклассник" },
      { id: uid(), hanzi:"课本", pinyin:"kèběn", translation:"учебник" },
      { id: uid(), hanzi:"汉语", pinyin:"hànyǔ", translation:"китайский язык" }
    ]}
  ];

  /* ===================== APP STATE ===================== */
  var initialLessons = loadLessons();
  var state = {
    route: initialLessons.length ? "home" : "onboarding",
    wide: window.innerWidth >= 900,
    lessons: initialLessons,
    settings: loadSettings(),
    currentLessonId: null,
    editingLessonId: null,
    editingTitle: "",
    editingWords: [],
    study: {
      words: [], order: [], index: 0, flipped: false, shuffled: false,
      mode: "cards", picked: null,
      quizCorrectCount: 0, quizTotalAnswered: 0,
      sessionType: "lesson", sessionLabel: ""
    },
    confirmDelete: null
  };

  applyTheme();

  function applyTheme(){
    document.documentElement.classList.toggle("dark", !!state.settings.dark);
  }

  function findLesson(id){
    for(var i=0;i<state.lessons.length;i++){ if(state.lessons[i].id === id) return state.lessons[i]; }
    return null;
  }
  function persist(){ saveLessons(state.lessons); }

  /* ===================== NAVIGATION ===================== */
  function goHome(){ state.route = "home"; render(); }
  function goStats(){ state.route = "stats"; render(); }
  function goSettings(){ state.route = "settings"; render(); }
  function goStudyNav(){
    if(state.lessons.length === 0){ showToast("Сначала создай урок"); return; }
    var id = state.currentLessonId && findLesson(state.currentLessonId) ? state.currentLessonId : state.lessons[0].id;
    openStudy(id);
  }
  function toggleTheme(){
    state.settings.dark = !state.settings.dark;
    saveSettings(state.settings);
    applyTheme();
    render();
  }

  function openCreateLesson(){
    state.route = "editor";
    state.editingLessonId = null;
    state.editingTitle = "";
    state.editingWords = [{ id: uid(), hanzi:"", pinyin:"", translation:"" }];
    state.bulkOpen = false;
    render();
  }
  function openEditLesson(lessonId){
    var lesson = findLesson(lessonId);
    if(!lesson) return;
    state.route = "editor";
    state.editingLessonId = lessonId;
    state.editingTitle = lesson.title;
    state.editingWords = lesson.words.map(function(w){
      return {id:w.id, hanzi:w.hanzi, pinyin:w.pinyin, translation:w.translation, srs:w.srs};
    });
    state.bulkOpen = false;
    render();
  }

  function openStudy(lessonId){
    var lesson = findLesson(lessonId);
    if(!lesson || lesson.words.length === 0){ showToast("В этом уроке пока нет слов"); return; }
    state.currentLessonId = lessonId;
    state.route = "study";
    state.study.sessionType = "lesson";
    state.study.sessionLabel = lesson.title;
    state.study.words = lesson.words;
    state.study.mode = "cards";
    resetStudy(false);
    render();
  }
  function openReviewSession(){
    var due = getDueWords();
    if(due.length === 0){ showToast("На сегодня повторять нечего 🎉"); return; }
    state.currentLessonId = null;
    state.route = "study";
    state.study.sessionType = "review";
    state.study.sessionLabel = "Повторение";
    state.study.words = due;
    state.study.mode = "cards";
    resetStudy(true);
    render();
  }
  function viewExamples(){
    var seeded = SEED.map(function(l){ return { id: uid(), title: l.title, words: l.words.map(function(w){ return Object.assign({}, w, { id: uid() }); }) }; });
    state.lessons = seeded;
    persist();
    goHome();
  }

  function resetStudy(shuffle){
    var words = state.study.words;
    var order = words.map(function(_, i){ return i; });
    if(shuffle){ shuffleArray(order); state.study.shuffled = true; }
    else { state.study.shuffled = false; }
    state.study.order = order;
    state.study.index = 0;
    state.study.flipped = false;
    state.study.picked = null;
    state.study.quizCorrectCount = 0;
    state.study.quizTotalAnswered = 0;
  }
  function shuffleArray(arr){
    for(var i=arr.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
    return arr;
  }

  function currentWord(){
    var words = state.study.words;
    var idx = state.study.order[state.study.index];
    return words[idx];
  }

  function quizOptionsFor(word){
    var pool = [];
    state.lessons.forEach(function(l){
      l.words.forEach(function(w){ if(w.translation && w.translation !== word.translation) pool.push(w.translation); });
    });
    var wrongs = Array.from(new Set(pool)).slice(0,3);
    var texts = [word.translation || "—"].concat(wrongs).sort(function(a,b){ return a.localeCompare(b, "ru"); });
    return texts.map(function(text){ return { text: text, correct: text === (word.translation || "—") }; });
  }

  function switchStudyMode(mode){
    if(state.study.mode === mode) return;
    state.study.mode = mode;
    state.study.flipped = false;
    state.study.picked = null;
    if(mode === "quiz") speak(currentWord().hanzi);
    render();
  }

  function flipCard(){
    state.study.flipped = !state.study.flipped;
    if(state.study.flipped) speak(currentWord().hanzi);
    render();
  }

  function handleMarkCard(word, correct){
    if(state.settings.srsEnabled) srsAnswer(word, correct);
    persist();
    goToNextCard();
  }
  function handleQuizAnswer(word, text, correct){
    if(state.study.picked) return;
    state.study.picked = text;
    state.study.quizTotalAnswered++;
    if(correct) state.study.quizCorrectCount++;
    logQuizAnswer(correct);
    if(state.settings.srsEnabled) srsAnswer(word, correct);
    persist();
    render();
  }
  function goToNextCard(){
    var total = state.study.order.length;
    logCardReviewed();
    if(state.study.index < total - 1){
      state.study.index++;
      state.study.flipped = false;
      state.study.picked = null;
      if(state.study.mode === "quiz") speak(currentWord().hanzi);
      render();
    } else {
      state.route = "done";
      render();
    }
  }
  function goToPrevCard(){
    if(state.study.index > 0){
      state.study.index--;
      state.study.flipped = false;
      state.study.picked = null;
      render();
    }
  }

  /* ===================== TOAST ===================== */
  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);

  /* ===================== HELPERS ===================== */
  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function escapeHtml(str){
    var d = document.createElement("div");
    d.textContent = str == null ? "" : str;
    return d.innerHTML;
  }
  function plural(n, a, b, c){
    var m = n % 100; if(m > 10 && m < 20) return c;
    var k = n % 10; return k === 1 ? a : (k > 1 && k < 5 ? b : c);
  }

  /* ===================== ROOT RENDER ===================== */
  function render(){
    var app = document.getElementById("app");
    app.innerHTML = "";

    if(state.route === "onboarding"){
      app.appendChild(renderShell(renderOnboarding(), false));
      return;
    }

    var content;
    if(state.route === "home") content = renderHome();
    else if(state.route === "editor") content = renderEditor();
    else if(state.route === "study") content = renderStudy();
    else if(state.route === "done") content = renderDone();
    else if(state.route === "stats") content = renderStats();
    else if(state.route === "settings") content = renderSettings();
    else content = renderHome();

    app.appendChild(renderShell(content, true));

    if(state.confirmDelete){ app.appendChild(renderDeleteModal()); }
  }

  function renderWordRows(container){
    container.innerHTML = "";

      hanziInput.addEventListener("blur", function(){
        if(state.settings.pinyinAuto && !word.pinyin && word.hanzi){
          var auto = autoPinyin(word.hanzi);
          if(auto){ word.pinyin = auto; pinyinInput.value = auto; }
        }
      });

      var pinyinInput = document.createElement("input");
      pinyinInput.className = "pinyin";
      pinyinInput.placeholder = "pīnyīn";
      pinyinInput.value = word.pinyin;
      pinyinInput.addEventListener("input", function(){ word.pinyin = pinyinInput.value; });

      var transInput = document.createElement("input");
      transInput.className = "translation";
      transInput.placeholder = "перевод";
      transInput.value = word.translation;
      transInput.addEventListener("input", function(){ word.translation = transInput.value; });

      var rm = el("button","rm","×");
      rm.title = "Удалить слово";
      rm.addEventListener("click", function(){

        var h2 = document.querySelector(".draft-header h2");
        if(h2) h2.textContent = "Слова урока (" + state.editingWords.length + ")";
        var hint = document.querySelector(".empty-hint");
        if(hint) hint.style.display = state.editingWords.length ? "none" : "block";
        renderWordRows(container);
      });

      row.appendChild(hanziInput);
      row.appendChild(pinyinInput);
      row.appendChild(transInput);
      row.appendChild(rm);
      container.appendChild(row);
    });
  }

  function parseBulk(text){
    return String(text).split(/\n+/).map(function(line){ return line.trim(); }).filter(Boolean).map(function(line){
      var parts = line.split(/\t|[,;]|\s{2,}|\s+[—–-]\s+/).map(function(p){ return p.trim(); }).filter(Boolean);
      var hanzi = parts[0] || "";
      var pinyin = "", translation = "";
      if(parts.length >= 3){ pinyin = parts[1]; translation = parts.slice(2).join(", "); }
      else if(parts.length === 2){
        if(/[а-яё]/i.test(parts[1])){ translation = parts[1]; pinyin = autoPinyin(hanzi); }
        else { pinyin = parts[1]; }
      } else { pinyin = autoPinyin(hanzi); }
      return { id: uid(), hanzi: hanzi, pinyin: pinyin, translation: translation };
    }).filter(function(w){ return w.hanzi; });
  }

  function saveLessonFromEditor(){
    var title = state.editingTitle.trim();
    if(!title){ showToast("Введите название урока"); return; }
    var cleanWords = state.editingWords
      .map(function(w){
        var hanzi = w.hanzi.trim(), pinyin = w.pinyin.trim(), translation = w.translation.trim();
        if(!pinyin && hanzi) pinyin = autoPinyin(hanzi);
        return { id: w.id, hanzi: hanzi, pinyin: pinyin, translation: translation, srs: w.srs };
      })
      .filter(function(w){ return w.hanzi || w.pinyin || w.translation; });

    if(state.editingLessonId){
      var lesson = findLesson(state.editingLessonId);
      if(lesson){ lesson.title = title; lesson.words = cleanWords; }
    } else {
      state.lessons.push({ id: uid(), title: title, words: cleanWords });
    }
    persist();
    showToast("Урок сохранён");
    goHome();
  }

  /* ===================== STUDY ===================== */
  function renderStudy(){
    var s = el("section","study-screen");
    var words = state.study.words;
    if(!words || words.length === 0){ goHome(); return s; }

    var header = el("header","screen-header");
    var back = el("button","round-btn","←");
    back.addEventListener("click", goHome);
    header.appendChild(back);
    var titleBlock = el("div");
    titleBlock.style.flex = "1"; titleBlock.style.minWidth = "0";
    var total = state.study.order.length, current = state.study.index + 1;
    titleBlock.innerHTML = '<div class="study-title"></div><div class="study-sub">Карточка ' + current + ' из ' + total + '</div>';
    titleBlock.querySelector(".study-title").textContent = state.study.sessionLabel;
    header.appendChild(titleBlock);
    var shuffleBtn = el("button","round-btn");
    shuffleBtn.title = "Перемешать";
    shuffleBtn.innerHTML = '<span class="icon">' + iconSvg("shuffle") + '</span>';
    shuffleBtn.addEventListener("click", function(){ resetStudy(true); render(); });
    header.appendChild(shuffleBtn);
    s.appendChild(header);

    var tabs = el("div","mode-tabs");
    var cardsBtn = el("button", state.study.mode === "cards" ? "active" : "", "Карточки");
    var quizBtn = el("button", state.study.mode === "quiz" ? "active" : "", "Угадай перевод");
    if(words.length < 2){ quizBtn.disabled = true; quizBtn.title = "Нужно минимум 2 слова"; }
    cardsBtn.addEventListener("click", function(){ switchStudyMode("cards"); });
    quizBtn.addEventListener("click", function(){ switchStudyMode("quiz"); });
    tabs.appendChild(cardsBtn); tabs.appendChild(quizBtn);
    s.appendChild(tabs);

    var progRow = el("div","progress-row");
    var pct = Math.round(state.study.index / total * 100);
    progRow.innerHTML =
      '<div class="progress-cap"></div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;"></div></div>' +
      '<div class="progress-cap"></div>' +
      '<span class="progress-pct">' + pct + '%</span>';
    s.appendChild(progRow);

    var word = currentWord();
    if(state.study.mode === "quiz") s.appendChild(renderGuessStage(word));
    else s.appendChild(renderFlipStage(word));

    return s;
  }

  function renderFlipStage(word){
    var stage = el("div","flip-stage");

    var card = el("div","flashcard" + (state.study.flipped ? " flipped" : ""));
    var front = el("div","fc-face fc-front wine-panel-steep");
    front.innerHTML = '<div class="orn"></div><div class="ring-tight"></div><span class="hanzi-big"></span><span class="tap-hint">Нажми, чтобы перевернуть</span>';
    front.querySelector(".hanzi-big").textContent = word.hanzi;

    var back = el("div","fc-face fc-back");
    back.innerHTML = '<div class="corner-tl"></div><div class="corner-br"></div><div class="hanzi-ghost"></div><div class="syllables"></div><div class="translation"></div><div class="tone-hint"></div>';
    back.querySelector(".hanzi-ghost").textContent = word.hanzi;
    var sylEl = back.querySelector(".syllables");
    syllables(word.pinyin, state.settings.toneColors).forEach(function(syl){
      var span = document.createElement("span");
      span.style.color = syl.color;
      span.textContent = syl.text;
      sylEl.appendChild(span);
    });
    back.querySelector(".translation").textContent = word.translation || "—";
    back.querySelector(".tone-hint").textContent = word.pinyin ? (state.settings.toneColors ? "Цвет слога — номер тона" : word.pinyin) : "Пиньинь не задан";

    card.appendChild(front);
    card.appendChild(back);
    card.addEventListener("click", flipCard);
    stage.appendChild(card);

    var srsRow = el("div","srs-row");
    var repeatBtn = el("button","srs-btn repeat","Повторить");
    repeatBtn.addEventListener("click", function(){ handleMarkCard(word, false); });
    var knowBtn = el("button","srs-btn know","Знаю");
    knowBtn.addEventListener("click", function(){ handleMarkCard(word, true); });
    srsRow.appendChild(repeatBtn); srsRow.appendChild(knowBtn);
    stage.appendChild(srsRow);

    var navRow = el("div","nav-row");
    var prevBtn = el("button",null,"← Пред.");
    prevBtn.addEventListener("click", goToPrevCard);
    var nextBtn = el("button",null,"Следующее →");
    nextBtn.addEventListener("click", goToNextCard);
    navRow.appendChild(prevBtn); navRow.appendChild(nextBtn);
    stage.appendChild(navRow);

    var restartBtn = el("button","restart-link","Начать заново");
    restartBtn.addEventListener("click", function(){ resetStudy(false); render(); });
    stage.appendChild(restartBtn);

    var hint = el("div","srs-hint", state.settings.srsEnabled ? "«Знаю» отложит карточку по расписанию SM-2" : "Интервальное повторение выключено");
    stage.appendChild(hint);

    return stage;
  }

  function renderGuessStage(word){
    var stage = el("div","guess-stage");

    var prompt = el("div","guess-prompt wine-panel-steep");
    prompt.innerHTML = '<div class="ring-loose"></div><div class="hanzi"></div><div class="hint">Выбери перевод</div>';
    prompt.querySelector(".hanzi").textContent = word.hanzi;
    stage.appendChild(prompt);

    var options = quizOptionsFor(word);
    var picked = state.study.picked;
    var optWrap = el("div","guess-options");
    options.forEach(function(opt){
      var btn = el("button","guess-option");
      var style = "border:1px solid var(--line); background:var(--surface); color:var(--ink);";
      var mark = "";
      if(picked){
        if(opt.correct){ style = "border:1px solid " + "var(--tone-2)" + "; background:rgba(110,138,78,0.12); color:var(--ink);"; mark = "верно"; }
        else if(opt.text === picked){ style = "border:1px solid var(--wine); background:rgba(140,34,48,0.08); color:var(--ink);"; mark = "мимо"; }
      }
      btn.setAttribute("style", style);
      btn.innerHTML = '<span></span><span class="mark" style="font-size:13px;"></span>';
      btn.querySelector("span").textContent = opt.text;
      btn.querySelector(".mark").textContent = mark;
      btn.querySelector(".mark").style.color = opt.correct ? "var(--tone-2)" : "var(--wine)";
      btn.addEventListener("click", function(){ handleQuizAnswer(word, opt.text, opt.correct); });
      optWrap.appendChild(btn);
    });
    stage.appendChild(optWrap);

    if(picked){
      var nextBtn = el("button","guess-next","Дальше");
      nextBtn.addEventListener("click", goToNextCard);
      stage.appendChild(nextBtn);
    }

    return stage;
  }

  /* ===================== DONE ===================== */
  function renderDone(){
    var s = el("section","done-screen");
    var label = state.study.sessionLabel || "";
    var isReview = state.study.sessionType === "review";

    var tile = el("div","done-emoji wine-panel-steep");
    tile.innerHTML = '<div class="orn"></div><div class="ring"></div><span class="logo-glyph">好</span>';
    s.appendChild(tile);

    s.appendChild(el("h2",null, isReview ? "Повторение завершено!" : "Урок пройден!"));
    var bodyText = isReview
      ? "Ты повторил все запланированные на сегодня слова."
      : "Ты просмотрел все карточки урока «" + escapeHtml(label) + "».";
    s.appendChild(el("p",null, bodyText));

    if(state.study.mode === "quiz" && state.study.quizTotalAnswered > 0){
      s.appendChild(el("p",null,"Правильных ответов: <b>" + state.study.quizCorrectCount + " из " + state.study.quizTotalAnswered + "</b>"));
    }

    var actions = el("div","done-actions");
    var repeatBtn = el("button","btn-primary","Повторить");
    repeatBtn.addEventListener("click", function(){
      if(isReview) openReviewSession();
      else { state.route = "study"; resetStudy(false); render(); }
    });
    var homeBtn = el("button","btn-outline","К урокам");
    homeBtn.addEventListener("click", goHome);
    actions.appendChild(repeatBtn); actions.appendChild(homeBtn);
    s.appendChild(actions);

    return s;
  }

  /* ===================== STATS ===================== */
  function renderStats(){
    var s = el("section","stats-screen");
    s.appendChild(el("h1","page-title","Статистика"));

    var streak = computeStreak();
    var best = updateBestStreak(streak);
    var known = countLearnedWords();
    var totalWords = state.lessons.reduce(function(n,l){ return n + l.words.length; }, 0);
    var quiz = loadQuizStats();
    var accuracy = quiz.total > 0 ? Math.round(quiz.correct / quiz.total * 100) : null;

    var grid = el("div","stats-grid");
    var streakTile = el("div","streak-tile wine-panel");
    streakTile.innerHTML =
      '<div class="orn"></div>' +
      '<div class="lbl">Серия</div>' +
      '<div class="row"><span>' + streak + '</span><span>' + plural(streak,"день","дня","дней") + '</span></div>' +
      '<div class="note">Лучший результат — ' + best + ' ' + plural(best,"день","дня","дней") + '</div>';
    grid.appendChild(streakTile);

    var tiles = [
      { label:"Выучено", value:String(known), unit:"слов", note:"из " + totalWords + " в твоих уроках" },
      { label:"Точность", value: accuracy == null ? "—" : String(accuracy), unit: accuracy == null ? "" : "%", note:"в режиме «Угадай»" },
      { label:"Уроков", value:String(state.lessons.length), unit:"", note:"созданы тобой" }
    ];
    tiles.forEach(function(t){
      var tile = el("div","stat-tile");
      tile.innerHTML =
        '<div class="lbl">' + t.label + '</div>' +
        '<div class="row"><span>' + t.value + '</span><span>' + t.unit + '</span></div>' +
        '<div class="note">' + t.note + '</div>';
      grid.appendChild(tile);
    });
    s.appendChild(grid);

    var chartPanel = el("div","panel");
    chartPanel.innerHTML = '<div class="panel-head"><h2>Карточки по дням</h2><span class="note">Последние ' + CHART_DAYS + ' дней</span></div>';
    var days = lastNDays(CHART_DAYS);
    var stats = loadStats();
    var map = {};
    stats.forEach(function(st){ map[st.date] = st.count; });
    var max = 1;
    days.forEach(function(d){ if((map[d]||0) > max) max = map[d]; });
    var chart = el("div","chart");
    days.forEach(function(d, i){
      var count = map[d] || 0;
      var col = el("div","chart-col");
      var bar = el("div","chart-bar");
      var hpct = Math.round(count / max * 100);
      bar.style.height = (count > 0 ? Math.max(hpct,6) : 3) + "%";
      bar.style.background = (i === days.length - 1) ? "linear-gradient(180deg,var(--gold),var(--wine))" : "rgba(140,34,48,0.32)";
      bar.title = d + ": " + count;
      col.appendChild(bar);
      col.appendChild(el("span","lbl", dayLabel(d)));
      chart.appendChild(col);
    });
    chartPanel.appendChild(chart);
    s.appendChild(chartPanel);

    var bucketPanel = el("div","panel");
    var bucketHeading = el("h2",null,"Очередь повторений");
    bucketHeading.style.cssText = "font-family:'Noto Serif SC',serif; font-size:16.5px; font-weight:600; margin:0 0 16px;";
    bucketPanel.appendChild(bucketHeading);

    var buckets = { today:0, tomorrow:0, week:0, later:0 };
    state.lessons.forEach(function(l){
      l.words.forEach(function(w){
        var d = daysUntilDue(w);
        if(d <= 0) buckets.today++;
        else if(d === 1) buckets.tomorrow++;
        else if(d <= 6) buckets.week++;
        else buckets.later++;
      });
    });
    var bucketMax = Math.max(buckets.today, buckets.tomorrow, buckets.week, buckets.later, 1);
    var bucketDefs = [
      { label:"Сегодня", count:buckets.today, fill:"var(--wine)" },
      { label:"Завтра", count:buckets.tomorrow, fill:"var(--wine)" },
      { label:"На неделе", count:buckets.week, fill:"var(--gold)" },
      { label:"Позже", count:buckets.later, fill:"var(--gold)" }
    ];
    var bucketList = el("div");
    bucketList.style.display = "flex"; bucketList.style.flexDirection = "column"; bucketList.style.gap = "12px";
    bucketDefs.forEach(function(b){
      var row = el("div","bucket-row");
      var w = b.count > 0 ? Math.max(Math.round(b.count / bucketMax * 100), 6) : 0;
      row.innerHTML =
        '<span class="lbl">' + b.label + '</span>' +
        '<div class="bucket-track"><div class="bucket-fill" style="width:' + w + '%; background:' + b.fill + ';"></div></div>' +
        '<span class="bucket-count">' + b.count + '</span>';
      bucketList.appendChild(row);
    });
    bucketPanel.appendChild(bucketList);
    s.appendChild(bucketPanel);

    return s;
  }

  /* ===================== SETTINGS ===================== */
  function renderSettings(){
    var s = el("section","settings-screen");
    s.appendChild(el("h1","page-title","Настройки"));

    var list = el("div","toggle-list");
    var defs = [
      { key:"dark", label:"Тёмная тема", note:"Почти чёрный фон с бордовым отливом" },
      { key:"pinyinAuto", label:"Автогенерация пиньиня", note:"Подставлять чтение при вводе иероглифа" },
      { key:"srsEnabled", label:"Интервальное повторение", note:"Показывать карточку в момент, когда она начинает забываться" },
      { key:"toneColors", label:"Цвета тонов", note:"Окрашивать слоги пиньиня по номеру тона" },
      { key:"sound", label:"Озвучка", note:"Проигрывать чтение при открытии карточки" }
    ];
    defs.forEach(function(d){
      var row = el("div","toggle-row");
      var on = !!state.settings[d.key];
      row.innerHTML = '<div class="info"><div class="label"></div><div class="note"></div></div>';
      row.querySelector(".label").textContent = d.label;
      row.querySelector(".note").textContent = d.note;
      var sw = el("button","switch");
      sw.style.background = on ? "var(--wine)" : "var(--sunk)";
      var knob = el("div","knob");
      knob.style.transform = on ? "translateX(22px)" : "translateX(0px)";
      sw.appendChild(knob);
      sw.addEventListener("click", function(){
        state.settings[d.key] = !state.settings[d.key];
        saveSettings(state.settings);
        if(d.key === "dark") applyTheme();
        render();
      });
      row.appendChild(sw);
      list.appendChild(row);
    });

    var goalRow = el("div","toggle-row");
    goalRow.innerHTML = '<div class="info"><div class="label">Дневная цель</div><div class="note">' + state.settings.goal + ' карточек в день</div></div>';
    var stepper = el("div","goal-stepper");
    var down = el("button","step-btn","−");
    down.addEventListener("click", function(){ state.settings.goal = Math.max(5, state.settings.goal - 5); saveSettings(state.settings); render(); });
    var up = el("button","step-btn","+");
    up.addEventListener("click", function(){ state.settings.goal = Math.min(120, state.settings.goal + 5); saveSettings(state.settings); render(); });
    stepper.appendChild(down); stepper.appendChild(up);
    goalRow.appendChild(stepper);
    list.appendChild(goalRow);
    s.appendChild(list);

    var legend = el("div","tone-legend");
    legend.innerHTML = '<div class="lbl">Цвета тонов</div>';
    var chips = el("div","chips");
    [["mā",1],["má",2],["mǎ",3],["mà",4],["ma",5]].forEach(function(t){
      var chip = el("div","tone-chip");
      chip.innerHTML = '<span class="dot" style="background:' + TONE[t[1]] + ';"></span><span class="sample">' + t[0] + '</span><span class="label">' + (t[1]===5 ? "нейтр." : t[1] + "-й") + '</span>';
      chips.appendChild(chip);
    });
    legend.appendChild(chips);
    s.appendChild(legend);

    return s;
  }

  /* ===================== INIT ===================== */
  window.addEventListener("resize", function(){
    var wide = window.innerWidth >= 900;
    if(wide !== state.wide){ state.wide = wide; render(); }
  });

  render();

})();
</script>
</body>
</html>
