<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>汉字 · Флеш-карточки</title>
<style>
  :root{
    --bg-1:#fdf6f0;
    --bg-2:#fbe9e3;
    --card-bg:#ffffff;
    --ink:#2b2320;
    --ink-soft:#7a6a63;
    --red:#c0392b;
    --red-dark:#96281b;
    --gold:#d4a72c;
    --gold-soft:#f6e6b4;
    --green:#3c8c5e;
    --shadow:0 10px 30px rgba(150,40,27,0.12);
    --shadow-sm:0 4px 12px rgba(43,35,32,0.08);
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg-1),var(--bg-2) 60%);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }

  #app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    max-width:720px;
    margin:0 auto;
    padding:18px 16px 40px;
  }

  /* ---------- header ---------- */
  header.topbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    min-height:44px;
  }
  .back-btn{
    background:var(--card-bg);
    border:none;
    border-radius:50%;
    width:44px;height:44px;
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    box-shadow:var(--shadow-sm);
    cursor:pointer;
    color:var(--red-dark);
    transition:transform .15s ease;
  }
  .back-btn:active{transform:scale(0.92);}
  .topbar h1{
    font-size:20px;
    margin:0;
    flex:1;
    line-height:1.2;
  }
  .topbar .sub{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:400;
    display:block;
  }

  .screen{
    animation:fadeIn .25s ease;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
  }

  button{font-family:inherit;}

  /* ---------- home screen ---------- */
  .hero{
    text-align:center;
    margin:6px 0 22px;
  }
  .hero .emoji{font-size:44px;display:block;margin-bottom:6px;}
  .hero h2{margin:0;font-size:22px;}
  .hero p{margin:6px 0 0;color:var(--ink-soft);font-size:14px;}

  .lesson-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:480px){
    .lesson-grid{grid-template-columns:1fr;}
  }

  .lesson-card{
    background:var(--card-bg);
    border-radius:var(--radius-lg);
    padding:16px;
    box-shadow:var(--shadow-sm);
    cursor:pointer;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
    border:1px solid rgba(192,57,43,0.06);
    display:flex;
    flex-direction:column;
    gap:8px;
    min-height:118px;
  }
  .lesson-card:active{transform:scale(0.97);}
  .lesson-card .icon{font-size:26px;}
  .lesson-card h3{
    margin:0;
    font-size:16px;
    line-height:1.3;
    word-break:break-word;
  }
  .lesson-card .count{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:auto;
  }
  .lesson-card .card-actions{
    position:absolute;
    top:10px;right:10px;
    display:flex;gap:6px;
  }
  .icon-btn{
    background:rgba(0,0,0,0.04);
    border:none;
    border-radius:50%;
    width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .icon-btn:active{background:rgba(0,0,0,0.09);}
  .icon-btn.danger:active{color:var(--red-dark);}

  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    padding:40px 16px;
    background:var(--card-bg);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);
  }
  .empty-state .emoji{font-size:40px;display:block;margin-bottom:10px;}

  .fab{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    width:min(688px, calc(100% - 32px));
    z-index:20;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--red),var(--red-dark));
    color:#fff;
    border:none;
    padding:16px 20px;
    border-radius:16px;
    font-size:16px;
    font-weight:600;
    width:100%;
    box-shadow:0 8px 20px rgba(192,57,43,0.32);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .12s ease;
  }
  .btn-primary:active{transform:scale(0.98);}
  .btn-secondary{
    background:var(--card-bg);
    color:var(--ink);
    border:1px solid rgba(0,0,0,0.08);
    padding:14px 18px;
    border-radius:14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    width:100%;
  }
  .btn-secondary:active{background:#f3ede9;}
  .btn-row{display:flex;gap:10px;margin-top:14px;}
  .btn-row > *{flex:1;}

  .spacer-fab{height:88px;}

  /* ---------- edit lesson screen ---------- */
  .field{margin-bottom:16px;}
  .field label{
    display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;
  }
  .field input[type=text], .field textarea{
    width:100%;
    border:1.5px solid rgba(0,0,0,0.1);
    border-radius:12px;
    padding:12px 14px;
    font-size:16px;
    background:var(--card-bg);
    color:var(--ink);
    font-family:inherit;
  }
  .field input:focus, .field textarea:focus{
    outline:none;
    border-color:var(--red);
  }
  .field textarea{resize:vertical;min-height:80px;line-height:1.5;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.4;}

  .section-title{
    font-size:14px;font-weight:700;color:var(--ink);
    margin:22px 0 10px;
    display:flex;align-items:center;gap:6px;
  }

  .word-row{
    background:var(--card-bg);
    border-radius:14px;
    padding:12px;
    box-shadow:var(--shadow-sm);
    margin-bottom:10px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:8px;
    align-items:center;
  }
  @media (max-width:520px){
    .word-row{grid-template-columns:1fr 1fr;grid-template-areas:"hanzi pinyin" "trans trans" "del del";}
    .word-row input:nth-child(1){grid-area:hanzi;}
    .word-row input:nth-child(2){grid-area:pinyin;}
    .word-row input:nth-child(3){grid-area:trans;}
    .word-row .icon-btn{grid-area:del;justify-self:end;}
  }
  .word-row input{
    border:1px solid rgba(0,0,0,0.1);
    border-radius:8px;
    padding:9px 10px;
    font-size:14px;
    font-family:inherit;
    width:100%;
    background:#fdfcfb;
  }
  .word-row input:focus{outline:none;border-color:var(--red);}
  .word-row input.hanzi-input{font-size:16px;font-weight:600;}

  .add-word-btn{
    background:var(--gold-soft);
    border:2px dashed var(--gold);
    color:#8a6d10;
    border-radius:14px;
    padding:12px;
    font-weight:600;
    font-size:14px;
    width:100%;
    cursor:pointer;
    margin-top:4px;
  }
  .add-word-btn:active{background:#f0dd9a;}

  details.bulk-add{
    background:var(--card-bg);
    border-radius:14px;
    box-shadow:var(--shadow-sm);
    padding:4px 14px 14px;
    margin-top:18px;
  }
  details.bulk-add summary{
    cursor:pointer;
    padding:12px 0;
    font-weight:600;
    font-size:14px;
    list-style:none;
    display:flex;align-items:center;gap:6px;
  }
  details.bulk-add summary::-webkit-details-marker{display:none;}
  details.bulk-add summary::before{content:"➕";font-size:13px;}
  details.bulk-add[open] summary::before{content:"➖";}

  /* ---------- study screen ---------- */
  .study-header{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:20px;
  }
  .study-meta{
    display:flex;justify-content:space-between;align-items:center;
    font-size:13px;color:var(--ink-soft);font-weight:600;
  }
  .progress-track{
    width:100%;height:8px;background:#eee1d8;border-radius:6px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:linear-gradient(90deg,var(--gold),var(--red));
    border-radius:6px;
    transition:width .3s ease;
  }

  .card-stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px 0 26px;
    min-height:300px;
    perspective:1400px;
  }
  .flashcard{
    width:min(340px,86vw);
    height:min(340px,86vw);
    max-height:380px;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
    cursor:pointer;
  }
  .flashcard.flipped{transform:rotateY(180deg);}
  .flashcard.pop{animation:pop .28s ease;}
  @keyframes pop{
    0%{transform:scale(0.9) rotateY(var(--ry,0deg));}
    60%{transform:scale(1.03) rotateY(var(--ry,0deg));}
    100%{transform:scale(1) rotateY(var(--ry,0deg));}
  }

  .card-face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .card-face.front{
    background:linear-gradient(150deg,#ffffff,#fff6ee);
    border:1px solid rgba(212,167,44,0.35);
  }
  .card-face.back{
    background:linear-gradient(150deg,var(--red),var(--red-dark));
    color:#fff;
    transform:rotateY(180deg);
  }
  .hanzi-text{
    font-size:clamp(48px,14vw,72px);
    font-weight:700;
    line-height:1.1;
    word-break:break-word;
  }
  .card-face.front .tap-hint{
    margin-top:14px;font-size:12px;color:var(--ink-soft);
  }
  .pinyin-text{
    font-size:clamp(22px,6vw,30px);
    font-weight:600;
    margin-bottom:10px;
    opacity:0.95;
  }
  .translation-text{
    font-size:clamp(16px,5vw,20px);
    opacity:0.92;
  }
  .card-face.back .tap-hint{
    margin-top:14px;font-size:12px;opacity:0.75;
  }

  .study-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:8px;
  }
  .nav-btn{
    background:var(--card-bg);
    border:none;
    border-radius:16px;
    padding:14px 18px;
    font-size:14px;
    font-weight:700;
    box-shadow:var(--shadow-sm);
    cursor:pointer;
    color:var(--ink);
    flex:1;
    max-width:150px;
  }
  .nav-btn:active{transform:scale(0.96);}
  .nav-btn:disabled{opacity:0.4;cursor:default;}
  .icon-round-btn{
    background:var(--card-bg);
    border:none;
    border-radius:50%;
    width:48px;height:48px;
    box-shadow:var(--shadow-sm);
    font-size:18px;
    cursor:pointer;
  }
  .icon-round-btn:active{transform:scale(0.92);}
  .icon-round-btn.active{background:var(--gold-soft);}

  .study-footer{
    display:flex;justify-content:center;margin-top:14px;
  }
  .link-btn{
    background:none;border:none;color:var(--ink-soft);font-size:13px;
    text-decoration:underline;cursor:pointer;padding:8px;
  }

  /* ---------- congrats screen ---------- */
  .congrats{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:8px;
    padding:20px;
    animation:fadeIn .35s ease;
  }
  .congrats .big-emoji{font-size:64px;animation:bounce .8s ease infinite alternate;}
  @keyframes bounce{
    from{transform:translateY(0);}
    to{transform:translateY(-10px);}
  }
  .congrats h2{margin:8px 0 4px;font-size:24px;}
  .congrats p{color:var(--ink-soft);margin:0 0 20px;font-size:14px;}
  .congrats .btn-row{width:100%;max-width:320px;}

  .toast{
    position:fixed;
    bottom:24px;left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:12px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:100;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .modal-backdrop{
    position:fixed;inset:0;
    background:rgba(30,20,15,0.45);
    display:flex;align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
    animation:fadeIn .2s ease;
  }
  .modal{
    background:var(--card-bg);
    border-radius:20px;
    padding:22px;
    max-width:340px;
    width:100%;
    box-shadow:var(--shadow);
    text-align:center;
  }
  .modal h3{margin:0 0 8px;font-size:17px;}
  .modal p{margin:0 0 18px;color:var(--ink-soft);font-size:14px;}
  .modal .btn-row{margin-top:0;}
  .btn-danger{
    background:linear-gradient(135deg,var(--red),var(--red-dark));
    color:#fff;border:none;border-radius:14px;padding:14px 18px;font-size:15px;font-weight:600;cursor:pointer;width:100%;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ===================== DATA LAYER ===================== */
  var STORAGE_KEY = "hanzi_flashcards_lessons_v1";

  function loadLessons(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){
      console.warn("Failed to load lessons", e);
      return [];
    }
  }

  function saveLessons(lessons){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lessons));
  }

  function uid(){
    return Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,9);
  }

  var seedIfEmpty = function(){
    var lessons = loadLessons();
    if(lessons.length === 0){
      lessons = [{
        id: uid(),
        title: "Урок 1 · Приветствия",
        words: [
          {id: uid(), hanzi:"你好", pinyin:"nǐ hǎo", translation:"привет"},
          {id: uid(), hanzi:"谢谢", pinyin:"xièxie", translation:"спасибо"},
          {id: uid(), hanzi:"再见", pinyin:"zàijiàn", translation:"до свидания"},
          {id: uid(), hanzi:"对不起", pinyin:"duìbùqǐ", translation:"извините"},
          {id: uid(), hanzi:"没关系", pinyin:"méi guānxi", translation:"ничего страшного"}
        ]
      }];
      saveLessons(lessons);
    }
    return lessons;
  };

  /* ===================== APP STATE ===================== */
  var state = {
    route: "home",          // home | edit | study | done
    lessons: seedIfEmpty(),
    currentLessonId: null,
    editingLessonId: null,  // null = creating new
    editingTitle: "",
    editingWords: [],       // [{id,hanzi,pinyin,translation}]
    study: {
      order: [],
      index: 0,
      flipped: false,
      shuffled: false
    },
    confirmDelete: null      // lesson id pending delete confirmation
  };

  function findLesson(id){
    for(var i=0;i<state.lessons.length;i++){
      if(state.lessons[i].id === id) return state.lessons[i];
    }
    return null;
  }

  function persist(){
    saveLessons(state.lessons);
  }

  /* ===================== NAVIGATION ===================== */
  function goHome(){
    state.route = "home";
    state.currentLessonId = null;
    render();
  }

  function openCreateLesson(){
    state.route = "edit";
    state.editingLessonId = null;
    state.editingTitle = "";
    state.editingWords = [];
    render();
  }

  function openEditLesson(lessonId){
    var lesson = findLesson(lessonId);
    if(!lesson) return;
    state.route = "edit";
    state.editingLessonId = lessonId;
    state.editingTitle = lesson.title;
    state.editingWords = lesson.words.map(function(w){
      return {id:w.id, hanzi:w.hanzi, pinyin:w.pinyin, translation:w.translation};
    });
    render();
  }

  function openStudy(lessonId){
    var lesson = findLesson(lessonId);
    if(!lesson || lesson.words.length === 0){
      showToast("В этом уроке пока нет слов");
      return;
    }
    state.currentLessonId = lessonId;
    state.route = "study";
    resetStudy(false);
    render();
  }

  function resetStudy(shuffle){
    var lesson = findLesson(state.currentLessonId);
    if(!lesson) return;
    var order = lesson.words.map(function(_, i){ return i; });
    if(shuffle){
      shuffleArray(order);
      state.study.shuffled = true;
    } else {
      state.study.shuffled = false;
    }
    state.study.order = order;
    state.study.index = 0;
    state.study.flipped = false;
  }

  function shuffleArray(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    }
    return arr;
  }

  /* ===================== TOAST ===================== */
  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 1800);
  }

  /* ===================== RENDER: ROOT ===================== */
  function render(){
    var app = document.getElementById("app");
    app.innerHTML = "";
    if(state.route === "home") app.appendChild(renderHome());
    else if(state.route === "edit") app.appendChild(renderEdit());
    else if(state.route === "study") app.appendChild(renderStudy());
    else if(state.route === "done") app.appendChild(renderDone());

    if(state.confirmDelete){
      app.appendChild(renderDeleteModal());
    }
  }

  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }

  /* ===================== HOME SCREEN ===================== */
  function renderHome(){
    var screen = el("div","screen");

    var header = el("header","topbar");
    header.innerHTML = '<div><h1>🏮 汉字 Карточки<span class="sub">Учи иероглифы легко</span></h1></div>';
    screen.appendChild(header);

    if(state.lessons.length === 0){
      var empty = el("div","empty-state");
      empty.innerHTML = '<span class="emoji">📚</span><div>Пока нет уроков.<br>Создай первый урок, чтобы начать!</div>';
      screen.appendChild(empty);
    } else {
      var hero = el("div","hero");
      hero.innerHTML = '<p>Выбери урок, чтобы начать тренировку 🏫</p>';
      screen.appendChild(hero);

      var grid = el("div","lesson-grid");
      state.lessons.forEach(function(lesson){
        grid.appendChild(renderLessonCard(lesson));
      });
      screen.appendChild(grid);
    }

    screen.appendChild(el("div","spacer-fab"));

    var fab = el("div","fab");
    var btn = el("button","btn-primary","➕ Создать урок");
    btn.addEventListener("click", openCreateLesson);
    fab.appendChild(btn);
    screen.appendChild(fab);

    return screen;
  }

  function renderLessonCard(lesson){
    var card = el("div","lesson-card");
    var count = lesson.words.length;
    var wordLabel = pluralWords(count);
    card.innerHTML =
      '<span class="icon">📖</span>' +
      '<h3></h3>' +
      '<span class="count"></span>' +
      '<div class="card-actions">' +
        '<button class="icon-btn edit-btn" title="Редактировать">✏️</button>' +
        '<button class="icon-btn danger del-btn" title="Удалить">🗑️</button>' +
      '</div>';
    card.querySelector("h3").textContent = lesson.title;
    card.querySelector(".count").textContent = count + " " + wordLabel;

    card.addEventListener("click", function(){
      openStudy(lesson.id);
    });
    card.querySelector(".edit-btn").addEventListener("click", function(ev){
      ev.stopPropagation();
      openEditLesson(lesson.id);
    });
    card.querySelector(".del-btn").addEventListener("click", function(ev){
      ev.stopPropagation();
      state.confirmDelete = lesson.id;
      render();
    });
    return card;
  }

  function pluralWords(n){
    var mod10 = n % 10, mod100 = n % 100;
    if(mod10 === 1 && mod100 !== 11) return "слово";
    if(mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return "слова";
    return "слов";
  }

  function renderDeleteModal(){
    var lesson = findLesson(state.confirmDelete);
    var backdrop = el("div","modal-backdrop");
    var modal = el("div","modal");
    modal.innerHTML =
      '<h3>Удалить урок?</h3>' +
      '<p>«' + escapeHtml(lesson ? lesson.title : "") + '» будет удалён без возможности восстановления.</p>';
    var row = el("div","btn-row");
    var cancelBtn = el("button","btn-secondary","Отмена");
    var delBtn = el("button","btn-danger","Удалить");
    cancelBtn.addEventListener("click", function(){
      state.confirmDelete = null;
      render();
    });
    delBtn.addEventListener("click", function(){
      state.lessons = state.lessons.filter(function(l){ return l.id !== state.confirmDelete; });
      persist();
      state.confirmDelete = null;
      render();
      showToast("Урок удалён");
    });
    row.appendChild(cancelBtn);
    row.appendChild(delBtn);
    modal.appendChild(row);
    backdrop.appendChild(modal);
    backdrop.addEventListener("click", function(ev){
      if(ev.target === backdrop){
        state.confirmDelete = null;
        render();
      }
    });
    return backdrop;
  }

  function escapeHtml(str){
    var d = document.createElement("div");
    d.textContent = str == null ? "" : str;
    return d.innerHTML;
  }

  /* ===================== EDIT LESSON SCREEN ===================== */
  function renderEdit(){
    var screen = el("div","screen");

    var header = el("header","topbar");
    var back = el("button","back-btn","←");
    back.addEventListener("click", goHome);
    header.appendChild(back);
    var h1 = el("h1", null, state.editingLessonId ? "Редактирование урока" : "Новый урок");
    header.appendChild(h1);
    screen.appendChild(header);

    // Title field
    var titleField = el("div","field");
    titleField.innerHTML = '<label for="lesson-title-input">Название урока</label>';
    var titleInput = document.createElement("input");
    titleInput.type = "text";
    titleInput.id = "lesson-title-input";
    titleInput.placeholder = "Например: Урок 1";
    titleInput.value = state.editingTitle;
    titleInput.addEventListener("input", function(){
      state.editingTitle = titleInput.value;
    });
    titleField.appendChild(titleInput);
    screen.appendChild(titleField);

    // Words section
    var sectionTitle = el("div","section-title","🏮 Слова урока (" + state.editingWords.length + ")");
    screen.appendChild(sectionTitle);

    var wordsContainer = el("div","words-container");
    wordsContainer.id = "words-container";
    renderWordRows(wordsContainer);
    screen.appendChild(wordsContainer);

    var addWordBtn = el("button","add-word-btn","+ Добавить слово");
    addWordBtn.addEventListener("click", function(){
      state.editingWords.push({id: uid(), hanzi:"", pinyin:"", translation:""});
      sectionTitle.textContent = "🏮 Слова урока (" + state.editingWords.length + ")";
      renderWordRows(wordsContainer);
      // focus the new row's first input
      var rows = wordsContainer.querySelectorAll(".word-row");
      var last = rows[rows.length-1];
      if(last) last.querySelector("input").focus();
    });
    screen.appendChild(addWordBtn);

    // Bulk add
    var details = document.createElement("details");
    details.className = "bulk-add";
    details.innerHTML =
      '<summary>Вставить список слов сразу</summary>' +
      '<div class="field" style="margin-bottom:8px;">' +
        '<textarea id="bulk-textarea" rows="5" placeholder="你好 - nǐ hǎo - привет\n谢谢 - xièxie - спасибо"></textarea>' +
        '<div class="hint">По одному слову на строку в формате: <b>иероглиф - пиньинь - перевод</b></div>' +
      '</div>';
    var bulkBtn = el("button","btn-secondary","Добавить из списка");
    bulkBtn.addEventListener("click", function(){
      var textarea = document.getElementById("bulk-textarea");
      var lines = textarea.value.split("\n");
      var added = 0;
      lines.forEach(function(line){
        var parsed = parseBulkLine(line);
        if(parsed){
          state.editingWords.push({id: uid(), hanzi:parsed.hanzi, pinyin:parsed.pinyin, translation:parsed.translation});
          added++;
        }
      });
      if(added > 0){
        textarea.value = "";
        sectionTitle.textContent = "🏮 Слова урока (" + state.editingWords.length + ")";
        renderWordRows(wordsContainer);
        showToast("Добавлено слов: " + added);
      } else {
        showToast("Не удалось распознать строки");
      }
    });
    details.appendChild(bulkBtn);
    screen.appendChild(details);

    screen.appendChild(el("div","spacer-fab"));

    var fab = el("div","fab");
    var row = el("div","btn-row");
    row.style.marginTop = "0";
    var cancelBtn = el("button","btn-secondary","Отмена");
    cancelBtn.addEventListener("click", goHome);
    var saveBtn = el("button","btn-primary","💾 Сохранить");
    saveBtn.addEventListener("click", function(){
      saveLessonFromEditor();
    });
    row.appendChild(cancelBtn);
    row.appendChild(saveBtn);
    fab.appendChild(row);
    screen.appendChild(fab);

    return screen;
  }

  function parseBulkLine(line){
    var trimmed = line.trim();
    if(!trimmed) return null;
    // split on " - " or " – " or " — " (with surrounding spaces preferred to avoid breaking pinyin tone marks)
    var parts = trimmed.split(/\s+[-–—]\s+/);
    if(parts.length < 3){
      // fallback: split on bare dash
      parts = trimmed.split(/[-–—]/).map(function(s){return s.trim();}).filter(Boolean);
    } else {
      parts = parts.map(function(s){return s.trim();});
    }
    if(parts.length < 3) return null;
    return {
      hanzi: parts[0],
      pinyin: parts[1],
      translation: parts.slice(2).join(" - ")
    };
  }

  function renderWordRows(container){
    container.innerHTML = "";
    if(state.editingWords.length === 0){
      var empty = el("div","hint","Слов пока нет — добавь первое слово ниже.");
      empty.style.marginBottom = "10px";
      container.appendChild(empty);
      return;
    }
    state.editingWords.forEach(function(word){
      var row = el("div","word-row");
      row.dataset.id = word.id;

      var hanziInput = document.createElement("input");
      hanziInput.type = "text";
      hanziInput.className = "hanzi-input";
      hanziInput.placeholder = "汉字";
      hanziInput.value = word.hanzi;
      hanziInput.addEventListener("input", function(){ word.hanzi = hanziInput.value; });

      var pinyinInput = document.createElement("input");
      pinyinInput.type = "text";
      pinyinInput.placeholder = "pīnyīn";
      pinyinInput.value = word.pinyin;
      pinyinInput.addEventListener("input", function(){ word.pinyin = pinyinInput.value; });

      var transInput = document.createElement("input");
      transInput.type = "text";
      transInput.placeholder = "перевод";
      transInput.value = word.translation;
      transInput.addEventListener("input", function(){ word.translation = transInput.value; });

      var delBtn = el("button","icon-btn danger","✕");
      delBtn.title = "Удалить слово";
      delBtn.addEventListener("click", function(){
        state.editingWords = state.editingWords.filter(function(w){ return w.id !== word.id; });
        var sectionTitle = document.querySelector(".section-title");
        if(sectionTitle) sectionTitle.textContent = "🏮 Слова урока (" + state.editingWords.length + ")";
        renderWordRows(container);
      });

      row.appendChild(hanziInput);
      row.appendChild(pinyinInput);
      row.appendChild(transInput);
      row.appendChild(delBtn);
      container.appendChild(row);
    });
  }

  function saveLessonFromEditor(){
    var title = state.editingTitle.trim();
    if(!title){
      showToast("Введите название урока");
      return;
    }
    var cleanWords = state.editingWords
      .map(function(w){
        return {
          id: w.id,
          hanzi: w.hanzi.trim(),
          pinyin: w.pinyin.trim(),
          translation: w.translation.trim()
        };
      })
      .filter(function(w){ return w.hanzi || w.pinyin || w.translation; });

    if(state.editingLessonId){
      var lesson = findLesson(state.editingLessonId);
      if(lesson){
        lesson.title = title;
        lesson.words = cleanWords;
      }
    } else {
      state.lessons.push({
        id: uid(),
        title: title,
        words: cleanWords
      });
    }
    persist();
    showToast("Урок сохранён");
    goHome();
  }

  /* ===================== STUDY SCREEN ===================== */
  function renderStudy(){
    var screen = el("div","screen");
    var lesson = findLesson(state.currentLessonId);
    if(!lesson){ goHome(); return screen; }

    var header = el("header","topbar");
    var back = el("button","back-btn","←");
    back.addEventListener("click", goHome);
    header.appendChild(back);
    var h1 = el("h1", null, escapeHtml(lesson.title) + '<span class="sub">Режим тренировки</span>');
    header.appendChild(h1);

    var shuffleBtn = el("button","icon-round-btn" + (state.study.shuffled ? " active" : ""), "🔀");
    shuffleBtn.title = "Перемешать";
    shuffleBtn.addEventListener("click", function(){
      resetStudy(true);
      render();
    });
    header.appendChild(shuffleBtn);
    screen.appendChild(header);

    var total = state.study.order.length;
    var current = state.study.index + 1;

    var studyHeader = el("div","study-header");
    var meta = el("div","study-meta");
    meta.innerHTML = '<span>Карточка ' + current + ' из ' + total + '</span><span>' + Math.round((state.study.index)/total*100) + '%</span>';
    var track = el("div","progress-track");
    var fill = el("div","progress-fill");
    fill.style.width = (state.study.index/total*100) + "%";
    track.appendChild(fill);
    studyHeader.appendChild(meta);
    studyHeader.appendChild(track);
    screen.appendChild(studyHeader);

    var wordIdx = state.study.order[state.study.index];
    var word = lesson.words[wordIdx];

    var stage = el("div","card-stage");
    var card = el("div","flashcard" + (state.study.flipped ? " flipped" : ""));
    card.id = "flashcard";

    var front = el("div","card-face front");
    front.innerHTML = '<div class="hanzi-text"></div><div class="tap-hint">👆 Нажми, чтобы перевернуть</div>';
    front.querySelector(".hanzi-text").textContent = word.hanzi;

    var back = el("div","card-face back");
    back.innerHTML = '<div class="pinyin-text"></div><div class="translation-text"></div><div class="tap-hint">👆 Нажми, чтобы перевернуть обратно</div>';
    back.querySelector(".pinyin-text").textContent = word.pinyin || "—";
    back.querySelector(".translation-text").textContent = word.translation || "—";

    card.appendChild(front);
    card.appendChild(back);
    card.addEventListener("click", function(){
      state.study.flipped = !state.study.flipped;
      render();
    });
    stage.appendChild(card);
    screen.appendChild(stage);

    var controls = el("div","study-controls");
    var prevBtn = el("button","nav-btn","◀ Пред.");
    prevBtn.disabled = state.study.index === 0;
    prevBtn.addEventListener("click", function(){
      if(state.study.index > 0){
        state.study.index--;
        state.study.flipped = false;
        render();
      }
    });
    var nextBtn = el("button","nav-btn", state.study.index === total-1 ? "Завершить ✓" : "Следующее ▶");
    nextBtn.addEventListener("click", function(){
      if(state.study.index < total - 1){
        state.study.index++;
        state.study.flipped = false;
        render();
      } else {
        state.route = "done";
        render();
      }
    });
    controls.appendChild(prevBtn);
    controls.appendChild(nextBtn);
    screen.appendChild(controls);

    var footer = el("div","study-footer");
    var restartBtn = el("button","link-btn","↺ Начать заново");
    restartBtn.addEventListener("click", function(){
      resetStudy(false);
      render();
    });
    footer.appendChild(restartBtn);
    screen.appendChild(footer);

    return screen;
  }

  /* ===================== DONE SCREEN ===================== */
  function renderDone(){
    var screen = el("div","screen");
    var lesson = findLesson(state.currentLessonId);

    var header = el("header","topbar");
    var back = el("button","back-btn","←");
    back.addEventListener("click", goHome);
    header.appendChild(back);
    header.appendChild(el("h1", null, lesson ? escapeHtml(lesson.title) : ""));
    screen.appendChild(header);

    var congrats = el("div","congrats");
    congrats.innerHTML =
      '<div class="big-emoji">🎉</div>' +
      '<h2>Урок пройден!</h2>' +
      '<p>Ты просмотрел все карточки урока «' + (lesson ? escapeHtml(lesson.title) : "") + '». Отличная работа! 🏮</p>';

    var row = el("div","btn-row");
    var repeatBtn = el("button","btn-primary","🔁 Повторить");
    repeatBtn.addEventListener("click", function(){
      state.route = "study";
      resetStudy(false);
      render();
    });
    var homeBtn = el("button","btn-secondary","🏠 К урокам");
    homeBtn.addEventListener("click", goHome);
    row.appendChild(repeatBtn);
    row.appendChild(homeBtn);
    congrats.appendChild(row);
    screen.appendChild(congrats);

    return screen;
  }

  /* ===================== INIT ===================== */
  render();

})();
</script>
</body>
</html>
