<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>汉字 · Флеш-карточки</title>
<style>
  :root{
    --bg-1:#fdf6f0;
    --bg-2:#fbe9e3;
    --card-bg:#ffffff;
    --ink:#2b2320;
    --ink-soft:#7a6a63;
    --red:#c0392b;
    --red-dark:#96281b;
    --gold:#d4a72c;
    --gold-soft:#f6e6b4;
    --green:#3c8c5e;
    --shadow:0 10px 30px rgba(150,40,27,0.12);
    --shadow-sm:0 4px 12px rgba(43,35,32,0.08);
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg-1),var(--bg-2) 60%);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }

  #app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    max-width:720px;
    margin:0 auto;
    padding:18px 16px 40px;
  }

  /* ---------- header ---------- */
  header.topbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    min-height:44px;
  }
  .back-btn{
    background:var(--card-bg);
    border:none;
    border-radius:50%;
    width:44px;height:44px;
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    box-shadow:var(--shadow-sm);
    cursor:pointer;
    color:var(--red-dark);
    transition:transform .15s ease;
  }
  .back-btn:active{transform:scale(0.92);}
  .topbar h1{
    font-size:20px;
    margin:0;
    flex:1;
    line-height:1.2;
  }
  .topbar .sub{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:400;
    display:block;
  }

  .screen{
    animation:fadeIn .25s ease;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
  }

  button{font-family:inherit;}

  /* ---------- home screen ---------- */
  .hero{
    text-align:center;
    margin:6px 0 22px;
  }
  .hero .emoji{font-size:44px;display:block;margin-bottom:6px;}
  .hero h2{margin:0;font-size:22px;}
  .hero p{margin:6px 0 0;color:var(--ink-soft);font-size:14px;}

  .lesson-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:480px){
    .lesson-grid{grid-template-columns:1fr;}
  }

  .lesson-card{
    background:var(--card-bg);
    border-radius:var(--radius-lg);
    padding:16px;
    box-shadow:var(--shadow-sm);
    cursor:pointer;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
    border:1px solid rgba(192,57,43,0.06);
    display:flex;
    flex-direction:column;
    gap:8px;
    min-height:118px;
  }
  .lesson-card:active{transform:scale(0.97);}
  .lesson-card .icon{font-size:26px;}
  .lesson-card h3{
    margin:0;
    font-size:16px;
    line-height:1.3;
    word-break:break-word;
  }
  .lesson-card .count{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:auto;
  }
  .lesson-card .card-actions{
    position:absolute;
    top:10px;right:10px;
    display:flex;gap:6px;
  }
  .icon-btn{
    background:rgba(0,0,0,0.04);
    border:none;
    border-radius:50%;
    width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .icon-btn:active{background:rgba(0,0,0,0.09);}
  .icon-btn.danger:active{color:var(--red-dark);}

  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    padding:40px 16px;
    background:var(--card-bg);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);
  }
  .empty-state .emoji{font-size:40px;display:block;margin-bottom:10px;}

  .fab{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    width:min(688px, calc(100% - 32px));
    z-index:20;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--red),var(--red-dark));
    color:#fff;
    border:none;
    padding:16px 20px;
    border-radius:16px;
    font-size:16px;
    font-weight:600;
    width:100%;
    box-shadow:0 8px 20px rgba(192,57,43,0.32);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .12s ease;
  }
  .btn-primary:active{transform:scale(0.98);}
  .btn-secondary{
    background:var(--card-bg);
    color:var(--ink);
    border:1px solid rgba(0,0,0,0.08);
    padding:14px 18px;
    border-radius:14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    width:100%;
  }
  .btn-secondary:active{background:#f3ede9;}
  .btn-row{display:flex;gap:10px;margin-top:14px;}
  .btn-row > *{flex:1;}

  .spacer-fab{height:88px;}

  /* ---------- review banner ---------- */
  .review-banner{
    background:linear-gradient(135deg,#e2b13c,#b6841f);
    color:#fff;
    border-radius:var(--radius-lg);
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
    box-shadow:var(--shadow);
    margin-bottom:18px;
    transition:transform .15s ease;
    border:none;
    width:100%;
    text-align:left;
  }
  .review-banner:active{transform:scale(0.98);}
  .review-banner.disabled{
    background:var(--card-bg);
    color:var(--ink-soft);
    cursor:default;
    box-shadow:var(--shadow-sm);
  }
  .review-banner .emoji{font-size:30px;flex:0 0 auto;}
  .review-banner .info{flex:1;min-width:0;}
  .review-banner .info h3{margin:0;font-size:15px;}
  .review-banner .info p{margin:4px 0 0;font-size:12px;opacity:0.9;}

  /* ---------- edit lesson screen ---------- */
  .field{margin-bottom:16px;}
  .field label{
    display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;
  }
  .field input[type=text], .field textarea{
    width:100%;
    border:1.5px solid rgba(0,0,0,0.1);
    border-radius:12px;
    padding:12px 14px;
    font-size:16px;
    background:var(--card-bg);
    color:var(--ink);
    font-family:inherit;
  }
  .field input:focus, .field textarea:focus{
    outline:none;
    border-color:var(--red);
  }
  .field textarea{resize:vertical;min-height:80px;line-height:1.5;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.4;}

  .section-title{
    font-size:14px;font-weight:700;color:var(--ink);
    margin:22px 0 10px;
    display:flex;align-items:center;gap:6px;
  }

  .word-row{
    background:var(--card-bg);
    border-radius:14px;
    padding:12px;
    box-shadow:var(--shadow-sm);
    margin-bottom:10px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:8px;
    align-items:center;
  }
  @media (max-width:520px){
    .word-row{grid-template-columns:1fr 1fr;grid-template-areas:"hanzi pinyin" "trans trans" "del del";}
    .word-row input:nth-child(1){grid-area:hanzi;}
    .word-row input:nth-child(2){grid-area:pinyin;}
    .word-row input:nth-child(3){grid-area:trans;}
    .word-row .icon-btn{grid-area:del;justify-self:end;}
  }
  .word-row input{
    border:1px solid rgba(0,0,0,0.1);
    border-radius:8px;
    padding:9px 10px;
    font-size:14px;
    font-family:inherit;
    width:100%;
    background:#fdfcfb;
  }
  .word-row input:focus{outline:none;border-color:var(--red);}
  .word-row input.hanzi-input{font-size:16px;font-weight:600;}

  .add-word-btn{
    background:var(--gold-soft);
    border:2px dashed var(--gold);
    color:#8a6d10;
    border-radius:14px;
    padding:12px;
    font-weight:600;
    font-size:14px;
    width:100%;
    cursor:pointer;
    margin-top:4px;
  }
  .add-word-btn:active{background:#f0dd9a;}

  details.bulk-add{
    background:var(--card-bg);
    border-radius:14px;
    box-shadow:var(--shadow-sm);
    padding:4px 14px 14px;
    margin-top:18px;
  }
  details.bulk-add summary{
    cursor:pointer;
    padding:12px 0;
    font-weight:600;
    font-size:14px;
    list-style:none;
    display:flex;align-items:center;gap:6px;
  }
  details.bulk-add summary::-webkit-details-marker{display:none;}
  details.bulk-add summary::before{content:"➕";font-size:13px;}
  details.bulk-add[open] summary::before{content:"➖";}

  /* ---------- study screen ---------- */
  .mode-switch{
    display:flex;
    background:var(--card-bg);
    border-radius:14px;
    padding:4px;
    box-shadow:var(--shadow-sm);
    margin-bottom:16px;
    gap:4px;
  }
  .mode-switch button{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 6px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .mode-switch button.active{
    background:linear-gradient(135deg,var(--red),var(--red-dark));
    color:#fff;
  }
  .mode-switch button:disabled{opacity:0.4;cursor:default;}

  .study-header{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:20px;
  }
  .study-meta{
    display:flex;justify-content:space-between;align-items:center;
    font-size:13px;color:var(--ink-soft);font-weight:600;
  }
  .progress-track{
    width:100%;height:8px;background:#eee1d8;border-radius:6px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:linear-gradient(90deg,var(--gold),var(--red));
    border-radius:6px;
    transition:width .3s ease;
  }

  .card-stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px 0 26px;
    min-height:300px;
    perspective:1400px;
  }
  .flashcard{
    width:min(340px,86vw);
    height:min(340px,86vw);
    max-height:380px;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
    cursor:pointer;
  }
  .flashcard.flipped{transform:rotateY(180deg);}

  .card-face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .card-face.front{
    background:linear-gradient(150deg,#ffffff,#fff6ee);
    border:1px solid rgba(212,167,44,0.35);
  }
  .card-face.back{
    background:linear-gradient(150deg,var(--red),var(--red-dark));
    color:#fff;
    transform:rotateY(180deg);
  }
  .hanzi-text{
    font-size:clamp(48px,14vw,72px);
    font-weight:700;
    line-height:1.1;
    word-break:break-word;
  }
  .card-face.front .tap-hint{
    margin-top:14px;font-size:12px;color:var(--ink-soft);
  }
  .pinyin-text{
    font-size:clamp(22px,6vw,30px);
    font-weight:600;
    margin-bottom:10px;
    opacity:0.95;
  }
  .translation-text{
    font-size:clamp(16px,5vw,20px);
    opacity:0.92;
  }
  .card-face.back .tap-hint{
    margin-top:14px;font-size:12px;opacity:0.75;
  }

  .srs-controls{
    display:flex;gap:12px;margin:4px 0 18px;
  }
  .srs-btn{
    flex:1;border:none;border-radius:16px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm);
    transition:transform .12s ease;
  }
  .srs-btn:active{transform:scale(0.96);}
  .srs-btn.repeat{background:#fdeceb;color:var(--red-dark);}
  .srs-btn.know{background:#e6f4ea;color:var(--green);}

  .study-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:8px;
  }
  .nav-btn{
    background:var(--card-bg);
    border:none;
    border-radius:16px;
    padding:14px 18px;
    font-size:14px;
    font-weight:700;
    box-shadow:var(--shadow-sm);
    cursor:pointer;
    color:var(--ink);
    flex:1;
    max-width:150px;
  }
  .nav-btn:active{transform:scale(0.96);}
  .nav-btn:disabled{opacity:0.4;cursor:default;}
  .icon-round-btn{
    background:var(--card-bg);
    border:none;
    border-radius:50%;
    width:48px;height:48px;
    box-shadow:var(--shadow-sm);
    font-size:18px;
    cursor:pointer;
    flex:0 0 auto;
  }
  .icon-round-btn:active{transform:scale(0.92);}
  .icon-round-btn.active{background:var(--gold-soft);}

  .study-footer{
    display:flex;justify-content:center;margin-top:14px;
  }
  .link-btn{
    background:none;border:none;color:var(--ink-soft);font-size:13px;
    text-decoration:underline;cursor:pointer;padding:8px;
  }

  /* ---------- quiz mode ---------- */
  .quiz-card{
    background:linear-gradient(150deg,#ffffff,#fff6ee);
    border:1px solid rgba(212,167,44,0.35);
    border-radius:28px;
    box-shadow:var(--shadow);
    padding:36px 24px;
    text-align:center;
    margin-bottom:20px;
  }
  .quiz-hanzi{
    font-size:clamp(48px,14vw,68px);
    font-weight:700;
    line-height:1.1;
    word-break:break-word;
  }
  .quiz-options{
    display:flex;flex-direction:column;gap:10px;margin-bottom:6px;
  }
  .quiz-option{
    background:var(--card-bg);
    border:2px solid rgba(0,0,0,0.08);
    border-radius:14px;
    padding:14px 16px;
    font-size:15px;
    font-weight:600;
    text-align:left;
    cursor:pointer;
    color:var(--ink);
    transition:transform .1s ease, background .2s ease, border-color .2s ease;
  }
  .quiz-option:active{transform:scale(0.98);}
  .quiz-option.correct{
    background:#e6f4ea;border-color:var(--green);color:#256b42;
  }
  .quiz-option.incorrect{
    background:#fdeceb;border-color:var(--red);color:var(--red-dark);
  }
  .quiz-option.disabled{cursor:default;}
  .quiz-feedback{
    text-align:center;font-weight:700;font-size:15px;margin:8px 0 18px;min-height:22px;
  }
  .quiz-feedback.correct{color:var(--green);}
  .quiz-feedback.incorrect{color:var(--red-dark);}

  /* ---------- congrats screen ---------- */
  .congrats{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:8px;
    padding:20px;
    animation:fadeIn .35s ease;
  }
  .congrats .big-emoji{font-size:64px;animation:bounce .8s ease infinite alternate;}
  @keyframes bounce{
    from{transform:translateY(0);}
    to{transform:translateY(-10px);}
  }
  .congrats h2{margin:8px 0 4px;font-size:24px;}
  .congrats p{color:var(--ink-soft);margin:0 0 6px;font-size:14px;}
  .congrats .btn-row{width:100%;max-width:320px;margin-top:20px;}

  /* ---------- stats screen ---------- */
  .stats-tiles{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;
  }
  .stat-tile{
    background:var(--card-bg);border-radius:16px;padding:18px 12px;box-shadow:var(--shadow-sm);text-align:center;
  }
  .stat-tile .value{font-size:26px;font-weight:800;color:var(--red-dark);}
  .stat-tile .label{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  .chart-card{
    background:var(--card-bg);border-radius:var(--radius-lg);padding:18px 14px 12px;box-shadow:var(--shadow-sm);margin-bottom:20px;
  }
  .chart-card h3{margin:0 0 16px;font-size:14px;}
  .chart-scroll{overflow-x:auto;padding-bottom:4px;}
  .chart-bars{
    display:flex;align-items:flex-end;gap:6px;height:130px;min-width:min-content;
  }
  .chart-bar-wrap{
    display:flex;flex-direction:column-reverse;align-items:center;gap:6px;width:16px;flex:0 0 auto;height:100%;
  }
  .chart-bar{
    width:100%;
    background:linear-gradient(180deg,var(--gold),var(--red));
    border-radius:4px 4px 0 0;
    min-height:2px;
  }
  .chart-bar-label{font-size:8px;color:var(--ink-soft);white-space:nowrap;}

  .toast{
    position:fixed;
    bottom:24px;left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:12px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:100;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .modal-backdrop{
    position:fixed;inset:0;
    background:rgba(30,20,15,0.45);
    display:flex;align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
    animation:fadeIn .2s ease;
  }
  .modal{
    background:var(--card-bg);
    border-radius:20px;
    padding:22px;
    max-width:340px;
    width:100%;
    box-shadow:var(--shadow);
    text-align:center;
  }
  .modal h3{margin:0 0 8px;font-size:17px;}
  .modal p{margin:0 0 18px;color:var(--ink-soft);font-size:14px;}
  .modal .btn-row{margin-top:0;}
  .btn-danger{
    background:linear-gradient(135deg,var(--red),var(--red-dark));
    color:#fff;border:none;border-radius:14px;padding:14px 18px;font-size:15px;font-weight:600;cursor:pointer;width:100%;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<!-- Библиотека транслитерации иероглифов в пиньинь (для автогенерации при добавлении слов) -->
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro/dist/index.js"></script>

<script>
(function(){
  "use strict";

  /* ===================== DATA LAYER ===================== */
  var STORAGE_KEY = "hanzi_flashcards_lessons_v1";
  var STATS_KEY = "hanzi_flashcards_stats_v1";
  var LEARNED_INTERVAL_THRESHOLD = 21; // дней — считаем слово "выученным"

  function loadLessons(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){
      console.warn("Failed to load lessons", e);
      return [];
    }
  }

  function saveLessons(lessons){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lessons));
  }

  function uid(){
    return Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,9);
  }

  /* ---------- дата и время ---------- */
  function formatDate(d){
    var y = d.getFullYear(), m = ("0"+(d.getMonth()+1)).slice(-2), day = ("0"+d.getDate()).slice(-2);
    return y + "-" + m + "-" + day;
  }
  function todayStr(){ return formatDate(new Date()); }
  function addDays(date, days){
    var d = new Date(date.getTime());
    d.setDate(d.getDate() + days);
    return d;
  }

  /* ---------- пиньинь автогенерация (pinyin-pro, подключена через CDN) ---------- */
  function autoPinyin(hanzi){
    try{
      if(window.pinyinPro && typeof window.pinyinPro.pinyin === "function"){
        var result = window.pinyinPro.pinyin(hanzi, { toneType: "symbol" });
        return (result || "").trim();
      }
    }catch(e){
      console.warn("Pinyin generation failed", e);
    }
    return "";
  }

  /* ---------- SRS (упрощённый SM-2) ---------- */
  function ensureSrs(word){
    if(!word.srs){
      word.srs = { interval: 0, easeFactor: 2.5, repetitions: 0, nextReviewDate: null };
    }
    return word.srs;
  }

  function isDue(word){
    var s = ensureSrs(word);
    if(!s.nextReviewDate) return true;
    return s.nextReviewDate <= todayStr();
  }

  function updateEaseFactor(ef, q){
    var next = ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
    return Math.max(1.3, next);
  }

  function srsAnswer(word, correct){
    var s = ensureSrs(word);
    var q = correct ? 5 : 2;
    s.easeFactor = updateEaseFactor(s.easeFactor, q);
    if(correct){
      s.repetitions = (s.repetitions || 0) + 1;
      if(s.repetitions === 1) s.interval = 1;
      else if(s.repetitions === 2) s.interval = 6;
      else s.interval = Math.round(s.interval * s.easeFactor);
    } else {
      s.repetitions = 0;
      s.interval = 1;
    }
    s.nextReviewDate = formatDate(addDays(new Date(), s.interval));
    s.lastReviewDate = todayStr();
  }

  function getDueWords(){
    var due = [];
    state.lessons.forEach(function(lesson){
      lesson.words.forEach(function(w){
        if(isDue(w)) due.push(w);
      });
    });
    persist();
    return due;
  }

  function countLearnedWords(){
    var count = 0;
    state.lessons.forEach(function(lesson){
      lesson.words.forEach(function(w){
        if(w.srs && w.srs.interval >= LEARNED_INTERVAL_THRESHOLD) count++;
      });
    });
    return count;
  }

  /* ---------- статистика по дням ---------- */
  function loadStats(){
    try{
      var raw = localStorage.getItem(STATS_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){
      return [];
    }
  }
  function saveStats(stats){
    localStorage.setItem(STATS_KEY, JSON.stringify(stats));
  }
  function logCardReviewed(){
    var stats = loadStats();
    var today = todayStr();
    var entry = null;
    for(var i=0;i<stats.length;i++){
      if(stats[i].date === today){ entry = stats[i]; break; }
    }
    if(entry){ entry.count += 1; }
    else { stats.push({ date: today, count: 1 }); }
    saveStats(stats);
  }
  function computeStreak(){
    var stats = loadStats();
    var map = {};
    stats.forEach(function(s){ map[s.date] = s.count; });
    var d = new Date();
    if(!(map[formatDate(d)] > 0)){
      d = addDays(d, -1);
    }
    var streak = 0;
    while(map[formatDate(d)] > 0){
      streak++;
      d = addDays(d, -1);
    }
    return streak;
  }
  function last30Days(){
    var arr = [];
    for(var i=29;i>=0;i--){
      arr.push(formatDate(addDays(new Date(), -i)));
    }
    return arr;
  }
  function dayLabel(dateStr){
    var d = new Date(dateStr + "T00:00:00");
    return ("0"+d.getDate()).slice(-2) + "." + ("0"+(d.getMonth()+1)).slice(-2);
  }

  function resetStudy(shuffle){
    var words = state.study.words;
    var order = words.map(function(_, i){ return i; });
    if(shuffle){
      shuffleArray(order);
      state.study.shuffled = true;
    } else {
      state.study.shuffled = false;
    }
    state.study.order = order;
    state.study.index = 0;
    state.study.flipped = false;
    state.study.quizAnswered = false;
    state.study.quizSelectedIndex = null;
    state.study.quizOptions = [];
    state.study.quizCorrectCount = 0;
    state.study.quizTotalAnswered = 0;
    if(state.study.mode === "quiz"){
      generateQuizOptions();
    }
  }

  function shuffleArray(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    }
    return arr;
  }

  /* ---------- режим "Угадай перевод" ---------- */
  function generateQuizOptions(){
    var words = state.study.words;
    var order = state.study.order;
    var word = words[order[state.study.index]];
    var pool = words.filter(function(w){
      return w !== word && (w.translation||"").trim() !== "";
    });
    shuffleArray(pool);
    var distractors = pool.slice(0,3);
    var options = distractors.map(function(w){ return { text: w.translation, isCorrect:false }; });
    options.push({ text: word.translation || "—", isCorrect:true });
    shuffleArray(options);
    state.study.quizOptions = options;
    state.study.quizAnswered = false;
    state.study.quizSelectedIndex = null;
  }

  function switchStudyMode(mode){
    if(state.study.mode === mode) return;
    state.study.mode = mode;
    state.study.flipped = false;
    if(mode === "quiz"){

    }
    render();
  }

  function handleMarkCard(word, correct){
    srsAnswer(word, correct);
    persist();
    goToNextCard();
  }

  function handleQuizAnswer(word, optionIndex){
    if(state.study.quizAnswered) return;
    var opt = state.study.quizOptions[optionIndex];
    var correct = !!opt.isCorrect;
    state.study.quizAnswered = true;
    state.study.quizSelectedIndex = optionIndex;
    state.study.quizTotalAnswered++;
    if(correct) state.study.quizCorrectCount++;
    srsAnswer(word, correct);
    persist();
    render();
  }

  function goToNextCard(){
    var total = state.study.order.length;
    logCardReviewed();
    if(state.study.index < total - 1){
      state.study.index++;
      state.study.flipped = false;
      if(state.study.mode === "quiz"){
        generateQuizOptions();
      }
      render();
    } else {
      state.route = "done";
      render();
    }
  }

  function goToPrevCard(){
    if(state.study.index > 0){
      state.study.index--;
      state.study.flipped = false;
      if(state.study.mode === "quiz"){
        generateQuizOptions();
      }
      render();
    }
  }

  function parseBulkLine(line){
    var trimmed = line.trim();
    if(!trimmed) return null;
    // split on " - " or " – " or " — " (with surrounding spaces preferred to avoid breaking pinyin tone marks)
    var parts = trimmed.split(/\s+[-–—]\s+/);
    if(parts.length < 2){
      // fallback: split on bare dash
      parts = trimmed.split(/[-–—]/).map(function(s){return s.trim();}).filter(Boolean);
    } else {
      parts = parts.map(function(s){return s.trim();});
    }
    if(parts.length < 2) return null;

    var hanzi, pinyin, translation;
    if(parts.length >= 3){
      hanzi = parts[0];
      pinyin = parts[1];
      translation = parts.slice(2).join(" - ");
    } else {
      // только 2 части: иероглиф - перевод (пиньинь сгенерируется автоматически)
      hanzi = parts[0];
      pinyin = "";
      translation = parts[1];
    }
    if(!pinyin && hanzi){
      pinyin = autoPinyin(hanzi);
    }
    return { hanzi: hanzi, pinyin: pinyin, translation: translation };
  }

  function saveLessonFromEditor(){
    var title = state.editingTitle.trim();
    if(!title){
      showToast("Введите название урока");
      return;
    }
    var cleanWords = state.editingWords
      .map(function(w){
        var hanzi = w.hanzi.trim();
        var pinyin = w.pinyin.trim();
        var translation = w.translation.trim();
        if(!pinyin && hanzi){
          pinyin = autoPinyin(hanzi); // подстраховка, если авто-заполнение по blur не сработало
        }
        return {
          id: w.id,
          hanzi: hanzi,
          pinyin: pinyin,
          translation: translation,
          srs: w.srs // сохраняем прогресс интервального повторения при редактировании
        };
      })
      .filter(function(w){ return w.hanzi || w.pinyin || w.translation; });

    if(state.editingLessonId){
      var lesson = findLesson(state.editingLessonId);
      if(lesson){
        lesson.title = title;
        lesson.words = cleanWords;
      }
    } else {
      state.lessons.push({
        id: uid(),
        title: title,
        words: cleanWords
      });
    }
    persist();
    showToast("Урок сохранён");
    goHome();
  }

    header.appendChild(h1);

    if(state.study.mode === "cards"){
      var shuffleBtn = el("button","icon-round-btn" + (state.study.shuffled ? " active" : ""), "🔀");
      shuffleBtn.title = "Перемешать";
      shuffleBtn.addEventListener("click", function(){
        resetStudy(true);
        render();
      });
      header.appendChild(shuffleBtn);
    }
    screen.appendChild(header);

    // переключатель режима тренировки
    var modeSwitch = el("div","mode-switch");
    var cardsBtn = el("button", state.study.mode === "cards" ? "active" : "", "🗂️ Карточки");
    var quizBtn = el("button", state.study.mode === "quiz" ? "active" : "", "❓ Угадай перевод");
    if(words.length < 2){
      quizBtn.disabled = true;
      quizBtn.title = "Нужно минимум 2 слова в уроке";
    }
    cardsBtn.addEventListener("click", function(){ switchStudyMode("cards"); });
    quizBtn.addEventListener("click", function(){ switchStudyMode("quiz"); });
    modeSwitch.appendChild(cardsBtn);
    modeSwitch.appendChild(quizBtn);
    screen.appendChild(modeSwitch);

    var total = state.study.order.length;
    var current = state.study.index + 1;

    var studyHeader = el("div","study-header");
    var meta = el("div","study-meta");
    meta.innerHTML = '<span>Карточка ' + current + ' из ' + total + '</span><span>' + Math.round((state.study.index)/total*100) + '%</span>';
    var track = el("div","progress-track");
    var fill = el("div","progress-fill");
    fill.style.width = (state.study.index/total*100) + "%";
    track.appendChild(fill);
    studyHeader.appendChild(meta);
    studyHeader.appendChild(track);
    screen.appendChild(studyHeader);

    var wordIdx = state.study.order[state.study.index];
    var word = words[wordIdx];

    if(state.study.mode === "quiz"){
      screen.appendChild(renderQuizStage(word));
    } else {
      screen.appendChild(renderCardStage(word));
    }

    return screen;
  }

  function renderCardStage(word){
    var wrap = el("div", null);

    var stage = el("div","card-stage");
    var card = el("div","flashcard" + (state.study.flipped ? " flipped" : ""));

    var front = el("div","card-face front");
    front.innerHTML = '<div class="hanzi-text"></div><div class="tap-hint">👆 Нажми, чтобы перевернуть</div>';
    front.querySelector(".hanzi-text").textContent = word.hanzi;

    var back = el("div","card-face back");
    back.innerHTML = '<div class="pinyin-text"></div><div class="translation-text"></div><div class="tap-hint">👆 Нажми, чтобы перевернуть обратно</div>';
    back.querySelector(".pinyin-text").textContent = word.pinyin || "—";
    back.querySelector(".translation-text").textContent = word.translation || "—";

    card.appendChild(front);
    card.appendChild(back);
    card.addEventListener("click", function(){
      state.study.flipped = !state.study.flipped;
      render();
    });
    stage.appendChild(card);
    wrap.appendChild(stage);

    var srsControls = el("div","srs-controls");
    var repeatBtn = el("button","srs-btn repeat","❌ Повторить");
    repeatBtn.addEventListener("click", function(){ handleMarkCard(word, false); });
    var knowBtn = el("button","srs-btn know","✅ Знаю");
    knowBtn.addEventListener("click", function(){ handleMarkCard(word, true); });
    srsControls.appendChild(repeatBtn);
    srsControls.appendChild(knowBtn);
    wrap.appendChild(srsControls);

    var total = state.study.order.length;
    var controls = el("div","study-controls");
    var prevBtn = el("button","nav-btn","◀ Пред.");
    prevBtn.disabled = state.study.index === 0;
    prevBtn.addEventListener("click", goToPrevCard);
    var nextBtn = el("button","nav-btn", state.study.index === total-1 ? "Завершить ✓" : "Следующее ▶");
    nextBtn.addEventListener("click", goToNextCard);
    controls.appendChild(prevBtn);
    controls.appendChild(nextBtn);
    wrap.appendChild(controls);

    var footer = el("div","study-footer");
    var restartBtn = el("button","link-btn","↺ Начать заново");
    restartBtn.addEventListener("click", function(){
      resetStudy(false);
      render();
    });
    footer.appendChild(restartBtn);
    wrap.appendChild(footer);

    return wrap;
  }

  function renderQuizStage(word){
    var wrap = el("div", null);

    var quizCard = el("div","quiz-card");
    quizCard.innerHTML = '<div class="quiz-hanzi"></div>';
    quizCard.querySelector(".quiz-hanzi").textContent = word.hanzi;
    wrap.appendChild(quizCard);

    var optionsWrap = el("div","quiz-options");
    var options = state.study.quizOptions;
    options.forEach(function(opt, i){
      var btn = el("button","quiz-option");
      btn.textContent = opt.text || "—";
      if(state.study.quizAnswered){
        btn.classList.add("disabled");
        if(opt.isCorrect){
          btn.classList.add("correct");
        } else if(i === state.study.quizSelectedIndex){
          btn.classList.add("incorrect");
        }
      }
      btn.addEventListener("click", function(){
        handleQuizAnswer(word, i);
      });
      optionsWrap.appendChild(btn);
    });
    wrap.appendChild(optionsWrap);

    var feedback = el("div","quiz-feedback");
    if(state.study.quizAnswered){
      var chosen = options[state.study.quizSelectedIndex];
      if(chosen && chosen.isCorrect){
        feedback.textContent = "✅ Верно!";
        feedback.classList.add("correct");
      } else {
        feedback.textContent = "❌ Неверно. Правильный ответ: " + (word.translation || "—");
        feedback.classList.add("incorrect");
      }
    }
    wrap.appendChild(feedback);

    var total = state.study.order.length;
    var controls = el("div","study-controls");
    var nextBtn = el("button","nav-btn", state.study.index === total-1 ? "Завершить ✓" : "Далее ▶");
    nextBtn.style.maxWidth = "220px";
    nextBtn.disabled = !state.study.quizAnswered;
    nextBtn.addEventListener("click", goToNextCard);
    controls.appendChild(nextBtn);
    wrap.appendChild(controls);

    return wrap;
  }

  /* ===================== DONE SCREEN ===================== */
  function renderDone(){
    var screen = el("div","screen");
    var label = state.study.sessionLabel || "";
    var isReview = state.study.sessionType === "review";

    var header = el("header","topbar");
    var back = el("button","back-btn","←");
    back.addEventListener("click", goHome);
    header.appendChild(back);
    header.appendChild(el("h1", null, escapeHtml(label)));
    screen.appendChild(header);

    var congrats = el("div","congrats");
    var bodyText = isReview
      ? "Ты повторил все запланированные на сегодня слова. Отличная работа! 🏮"
      : "Ты просмотрел все карточки урока «" + escapeHtml(label) + "». Отличная работа! 🏮";

    var quizSummaryHtml = "";
    if(state.study.mode === "quiz" && state.study.quizTotalAnswered > 0){
      quizSummaryHtml = '<p>Правильных ответов: <b>' + state.study.quizCorrectCount + ' из ' + state.study.quizTotalAnswered + '</b></p>';
    }

    congrats.innerHTML =
      '<div class="big-emoji">🎉</div>' +
      '<h2>' + (isReview ? "Повторение завершено!" : "Урок пройден!") + '</h2>' +
      '<p>' + bodyText + '</p>' +
      quizSummaryHtml;

    var row = el("div","btn-row");
    var repeatBtn = el("button","btn-primary","🔁 Повторить");
    repeatBtn.addEventListener("click", function(){
      if(isReview){
        openReviewSession();
      } else {
        state.route = "study";
        resetStudy(false);
        render();
      }
    });
    var homeBtn = el("button","btn-secondary","🏠 К урокам");
    homeBtn.addEventListener("click", goHome);
    row.appendChild(repeatBtn);
    row.appendChild(homeBtn);
    congrats.appendChild(row);
    screen.appendChild(congrats);

    return screen;
  }

  /* ===================== STATS SCREEN ===================== */
  function renderStats(){
    var screen = el("div","screen");

    var header = el("header","topbar");
    var back = el("button","back-btn","←");
    back.addEventListener("click", goHome);
    header.appendChild(back);
    header.appendChild(el("h1", null, "📊 Статистика"));
    screen.appendChild(header);

    var streak = computeStreak();
    var learned = countLearnedWords();

    var tiles = el("div","stats-tiles");
    tiles.innerHTML =
      '<div class="stat-tile"><div class="value">🔥 ' + streak + '</div><div class="label">' + pluralDays(streak) + ' подряд</div></div>' +
      '<div class="stat-tile"><div class="value">🎓 ' + learned + '</div><div class="label">' + pluralWords(learned) + ' выучено</div></div>';
    screen.appendChild(tiles);

    var stats = loadStats();
    var map = {};
    stats.forEach(function(s){ map[s.date] = s.count; });
    var days = last30Days();
    var max = 1;
    days.forEach(function(d){ if((map[d]||0) > max) max = map[d]; });

    var chartCard = el("div","chart-card");
    chartCard.appendChild(el("h3", null, "Карточек за последние 30 дней"));
    var scroll = el("div","chart-scroll");
    var bars = el("div","chart-bars");
    days.forEach(function(d){
      var count = map[d] || 0;
      var wrap = el("div","chart-bar-wrap");
      var bar = el("div","chart-bar");
      var heightPx = Math.round((count / max) * 110);
      bar.style.height = (count > 0 ? Math.max(heightPx, 4) : 2) + "px";
      bar.title = d + ": " + count;
      wrap.appendChild(bar);
      wrap.appendChild(el("div","chart-bar-label", dayLabel(d)));
      bars.appendChild(wrap);
    });
    scroll.appendChild(bars);
    chartCard.appendChild(scroll);
    screen.appendChild(chartCard);

    // прокручиваем график к сегодняшнему дню (самому свежему, справа), иначе он скрыт за пределами видимой области
    requestAnimationFrame(function(){
      scroll.scrollLeft = scroll.scrollWidth;
    });

    if(stats.length === 0){
      var empty = el("div","empty-state");
      empty.innerHTML = '<span class="emoji">📈</span><div>Пока нет данных.<br>Пройди хотя бы одну тренировку, чтобы увидеть статистику!</div>';
      screen.appendChild(empty);
    }

    return screen;
  }

  function pluralDays(n){
    var mod10 = n % 10, mod100 = n % 100;
    if(mod10 === 1 && mod100 !== 11) return "день";
    if(mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return "дня";
    return "дней";
  }

  /* ===================== INIT ===================== */
  render();

})();
</script>
</body>
</html>
